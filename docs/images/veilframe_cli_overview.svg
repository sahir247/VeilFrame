<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background:#09090b;font-family:'Cascadia Code','SF Mono',Consolas,Menlo,monospace;">
  <defs>
    <filter id="terminalShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Terminal Window -->
  <g filter="url(#terminalShadow)">
    <rect x="30" y="30" width="940" height="580" rx="8" fill="#121215" stroke="#27272a" stroke-width="1.5"/>
  </g>

  <!-- Title bar -->
  <rect x="30" y="30" width="940" height="38" rx="8" fill="#18181b"/>
  <circle cx="54" cy="49" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="70" cy="49" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="86" cy="49" r="5" fill="#10b981" opacity="0.8"/>
  <text x="500" y="53" fill="#a1a1aa" font-size="11" font-weight="600" text-anchor="middle">veilframe terminal — bash</text>

  <!-- Terminal Content -->
  <g transform="translate(54, 95)" font-size="12" line-height="1.5">
    <!-- Command 1: Image Sanitize -->
    <text x="0" y="0" fill="#3b82f6" font-weight="700">$ <tspan fill="#f4f4f5">veilframe image sanitize raw_evidence.jpg -o clean_evidence.jpg --detectors face,plate,text,code</tspan></text>
    
    <text x="0" y="24" fill="#a1a1aa">[1/6] Loading source snapshot: <tspan fill="#e4e4e7">raw_evidence.jpg</tspan> (1920x1080, 2.14 MB)</text>
    <text x="0" y="42" fill="#a1a1aa">[2/6] Layer A: Stripped 48 EXIF/XMP container metadata atoms &amp; IFD1 preview stream</text>
    <text x="0" y="60" fill="#a1a1aa">[3/6] Layer B: Baked EXIF orientation 1 -> Normalized linear sRGB float32</text>
    <text x="0" y="78" fill="#a1a1aa">[4/6] Detection &amp; Graph: 3 Faces, 1 License Plate, 4 Text Blocks, 1 QR Code</text>
    <text x="0" y="96" fill="#a1a1aa">[5/6] Layer C: Isolated ConstantFill solid overwrite (ABSENT source dependence)</text>
    <text x="0" y="114" fill="#a1a1aa">[6/6] Executing Adversarial Red-Team Probe Suite (7 probes, min level 3)...</text>
    
    <text x="16" y="138" fill="#10b981">● Probe_MetadataClean      [PASS] (0 residual metadata keys)</text>
    <text x="16" y="156" fill="#10b981">● Probe_ThumbnailClean     [PASS] (0 residual thumbnail streams)</text>
    <text x="16" y="174" fill="#10b981">● Probe_FaceRedteam_DNN    [PASS] (0 detected faces, confidence &lt; 0.50)</text>
    <text x="16" y="192" fill="#10b981">● Probe_PlateRedteam_Otsu  [PASS] (0 detected plates, confidence &lt; 0.50)</text>
    <text x="16" y="210" fill="#10b981">● Probe_TextRedteam_Grad   [PASS] (0 detected text blocks, confidence &lt; 0.70)</text>
    <text x="16" y="228" fill="#10b981">● Probe_CodeRedteam_Multi  [PASS] (0 detected QR/barcodes)</text>
    
    <text x="0" y="254" fill="#60a5fa">-- Image QualityGate Verdict --</text>
    <text x="0" y="272" fill="#f4f4f5">   Five Contracts:  <tspan fill="#34d399" font-weight="700">PASS</tspan> (Privacy, Geometry, Fidelity, Integrity, Completeness)</text>
    <text x="0" y="290" fill="#f4f4f5">   Outside-Mask SSIM: <tspan fill="#34d399">0.9991</tspan> (&gt;= 0.9500)  |  PSNR: <tspan fill="#34d399">49.4 dB</tspan> (&gt;= 35.0 dB)</text>
    <text x="0" y="308" fill="#f4f4f5">   Publication Integrity: <tspan fill="#34d399">HOLDS</tspan> (Candidate SHA-256 == Final Artifact SHA-256)</text>
    
    <text x="0" y="332" fill="#a1a1aa">Artifacts published:</text>
    <text x="16" y="350" fill="#e4e4e7">  clean_evidence.jpg</text>
    <text x="16" y="368" fill="#e4e4e7">  clean_evidence.jpg.manifest.json  (RFC 8785 Canonical JSON)</text>
    <text x="16" y="386" fill="#e4e4e7">  clean_evidence.jpg.sig            (Ed25519 Digital Signature)</text>
    <text x="16" y="404" fill="#e4e4e7">  clean_evidence.jpg.pubkey.pem     (Signer Public Key DER/PEM)</text>

    <!-- Command 2: Verify -->
    <text x="0" y="440" fill="#3b82f6" font-weight="700">$ <tspan fill="#f4f4f5">veilframe image verify -i clean_evidence.jpg -m clean_evidence.jpg.manifest.json</tspan></text>
    <text x="0" y="462" fill="#10b981">[PASS] Image bitstream SHA-256 matches candidate &amp; final artifact claims</text>
    <text x="0" y="480" fill="#10b981">[PASS] Ed25519 digital signature verified against trust anchor (anchor-primary)</text>
    <text x="0" y="498" fill="#10b981">[PASS] Manifest trust status: TRUSTED_VALID</text>
  </g>
</svg>
