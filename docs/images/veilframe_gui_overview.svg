<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0f0f11;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <g filter="url(#shadow)">
    <rect x="30" y="30" width="940" height="620" rx="8" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.5"/>
  </g>

  <!-- Window Header / Titlebar -->
  <rect x="30" y="30" width="940" height="42" rx="8" fill="#141417"/>
  <!-- Window Controls -->
  <circle cx="54" cy="51" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="70" cy="51" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="86" cy="51" r="5" fill="#10b981" opacity="0.8"/>

  <!-- Brand Title -->
  <text x="120" y="55" fill="#f4f4f5" font-size="13" font-weight="800" letter-spacing="2">VEILFRAME</text>
  <text x="215" y="55" fill="#71717a" font-size="11" font-weight="500">v2.0 — Auditable Multimedia Privacy Compiler</text>

  <!-- Top Mode Switcher -->
  <g transform="translate(680, 40)">
    <rect x="0" y="0" width="260" height="24" rx="4" fill="#1f1f23" stroke="#27272a"/>
    <rect x="2" y="2" width="126" height="20" rx="3" fill="#27272a"/>
    <text x="65" y="16" fill="#e4e4e7" font-size="10" font-weight="700" text-anchor="middle">VIDEO SANITIZER</text>
    <rect x="130" y="2" width="128" height="20" rx="3" fill="#2563eb"/>
    <text x="194" y="16" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">IMAGE COMPILER</text>
  </g>

  <!-- Main Content Layout (Two Columns) -->

  <!-- Left Column: Source Input & Controls -->
  <g transform="translate(50, 85)">
    <!-- Drop Zone -->
    <rect x="0" y="0" width="460" height="85" rx="6" fill="#161618" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="230" y="36" fill="#f4f4f5" font-size="12" font-weight="700" text-anchor="middle">Drop Video or Image Media Here</text>
    <text x="230" y="54" fill="#71717a" font-size="10" text-anchor="middle">Supported: MP4, MOV, MKV, WebM | JPEG, PNG, WebP</text>
    <rect x="180" y="62" width="100" height="16" rx="3" fill="#27272a" stroke="#3f3f46"/>
    <text x="230" y="74" fill="#a1a1aa" font-size="9" font-weight="600" text-anchor="middle">Browse File</text>

    <!-- Provider Status Bar -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="460" height="26" rx="4" fill="#1a1a1d" stroke="#27272a"/>
      <circle cx="14" cy="13" r="3.5" fill="#10b981"/>
      <text x="24" y="17" fill="#10b981" font-size="10" font-weight="700">OpenCV 4.10</text>
      <line x1="100" y1="6" x2="100" y2="20" stroke="#3f3f46"/>
      <circle cx="114" cy="13" r="3.5" fill="#10b981"/>
      <text x="124" y="17" fill="#10b981" font-size="10" font-weight="700">FFmpeg 7.1</text>
      <line x1="195" y1="6" x2="195" y2="20" stroke="#3f3f46"/>
      <text x="210" y="17" fill="#a1a1aa" font-size="10">Fail-Closed 5-Contract Gate</text>
    </g>

    <!-- Image / Video Source Card -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="460" height="75" rx="6" fill="#18181b" stroke="#27272a"/>
      <text x="12" y="18" fill="#71717a" font-size="9" font-weight="800" letter-spacing="1">SOURCE IMAGE SPECIFICATION</text>
      <text x="12" y="38" fill="#71717a" font-size="10">File: <tspan fill="#f4f4f5" font-weight="600">surveillance_sample_04.jpg</tspan></text>
      <text x="260" y="38" fill="#71717a" font-size="10">Format: <tspan fill="#f4f4f5" font-weight="600">JPEG (3 channels)</tspan></text>
      <text x="12" y="56" fill="#71717a" font-size="10">Dimensions: <tspan fill="#f4f4f5" font-weight="600">1920 × 1080 px</tspan></text>
      <text x="260" y="56" fill="#71717a" font-size="10">Size: <tspan fill="#f4f4f5" font-weight="600">1.84 MB</tspan></text>
    </g>

    <!-- Semantic Detectors Card -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="460" height="155" rx="6" fill="#18181b" stroke="#27272a"/>
      <text x="12" y="18" fill="#71717a" font-size="9" font-weight="800" letter-spacing="1">SEMANTIC PRIVACY DETECTORS &amp; ACTIONS</text>
      
      <!-- Checkbox 1 -->
      <rect x="14" y="32" width="12" height="12" rx="2" fill="#2563eb"/>
      <path d="M 16 38 L 19 41 L 24 35" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <text x="34" y="42" fill="#f4f4f5" font-size="11" font-weight="600">Facial Identity Redaction (Haar + Multi-Scale)</text>

      <!-- Checkbox 2 -->
      <rect x="14" y="58" width="12" height="12" rx="2" fill="#2563eb"/>
      <path d="M 16 64 L 19 67 L 24 61" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <text x="34" y="68" fill="#f4f4f5" font-size="11" font-weight="600">Vehicle License Plates (Contour Aspect-Ratio Filter)</text>

      <!-- Checkbox 3 -->
      <rect x="14" y="84" width="12" height="12" rx="2" fill="#2563eb"/>
      <path d="M 16 90 L 19 93 L 24 87" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <text x="34" y="94" fill="#f4f4f5" font-size="11" font-weight="600">Document / Scene Text (MSER Variance Gated)</text>

      <!-- Checkbox 4 -->
      <rect x="14" y="110" width="12" height="12" rx="2" fill="#2563eb"/>
      <path d="M 16 116 L 19 119 L 24 113" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <text x="34" y="120" fill="#f4f4f5" font-size="11" font-weight="600">QR Codes &amp; 2D Barcodes (Finder Pattern Search)</text>

      <!-- Sub-options -->
      <line x1="14" y1="130" x2="446" y2="130" stroke="#27272a"/>
      <text x="14" y="146" fill="#a1a1aa" font-size="10">Solid Fill: <tspan fill="#e4e4e7" font-weight="600">Black (#000000)</tspan></text>
      <text x="240" y="146" fill="#a1a1aa" font-size="10">Expansion Margin: <tspan fill="#e4e4e7" font-weight="600">10 px</tspan></text>
    </g>

    <!-- Process Action Button -->
    <g transform="translate(0, 380)">
      <rect x="0" y="0" width="460" height="38" rx="5" fill="url(#accentGrad)"/>
      <text x="230" y="24" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="1" text-anchor="middle">EXECUTE COMPILER &amp; RED-TEAM VERIFICATION</text>
    </g>
  </g>

  <!-- Right Column: Verification Report & QualityGate -->
  <g transform="translate(530, 85)">
    <rect x="0" y="0" width="440" height="530" rx="6" fill="#18181b" stroke="#27272a"/>
    
    <!-- Report Tabs Header -->
    <rect x="0" y="0" width="440" height="34" rx="6" fill="#141417"/>
    <text x="14" y="22" fill="#71717a" font-size="10" font-weight="800" letter-spacing="1">AUDIT &amp; QUALITYGATE VERDICT</text>
    <rect x="330" y="7" width="96" height="20" rx="3" fill="#064e3b" stroke="#059669"/>
    <text x="378" y="21" fill="#34d399" font-size="10" font-weight="800" text-anchor="middle">VERDICT: PASS</text>

    <!-- 5 Normative Contracts Matrix -->
    <g transform="translate(14, 45)">
      <text x="0" y="12" fill="#a1a1aa" font-size="10" font-weight="700">FIVE NORMATIVE CONTRACTS</text>

      <!-- Row 1: Privacy Contract -->
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="412" height="26" rx="4" fill="#1f1f23"/>
        <text x="10" y="17" fill="#e4e4e7" font-size="10">1. Privacy Contract (Red-Team Probes)</text>
        <rect x="350" y="4" width="52" height="18" rx="2" fill="#064e3b"/>
        <text x="376" y="16" fill="#34d399" font-size="9" font-weight="800" text-anchor="middle">PASS</text>
      </g>

      <!-- Row 2: Geometry Contract -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="412" height="26" rx="4" fill="#1f1f23"/>
        <text x="10" y="17" fill="#e4e4e7" font-size="10">2. Geometry Contract (||Observed - Expected|| = 0px)</text>
        <rect x="350" y="4" width="52" height="18" rx="2" fill="#064e3b"/>
        <text x="376" y="16" fill="#34d399" font-size="9" font-weight="800" text-anchor="middle">PASS</text>
      </g>

      <!-- Row 3: Fidelity Contract -->
      <g transform="translate(0, 82)">
        <rect x="0" y="0" width="412" height="26" rx="4" fill="#1f1f23"/>
        <text x="10" y="17" fill="#e4e4e7" font-size="10">3. Fidelity Contract (SSIM 0.9982, PSNR 48.2 dB)</text>
        <rect x="350" y="4" width="52" height="18" rx="2" fill="#064e3b"/>
        <text x="376" y="16" fill="#34d399" font-size="9" font-weight="800" text-anchor="middle">PASS</text>
      </g>

      <!-- Row 4: Integrity Contract -->
      <g transform="translate(0, 112)">
        <rect x="0" y="0" width="412" height="26" rx="4" fill="#1f1f23"/>
        <text x="10" y="17" fill="#e4e4e7" font-size="10">4. Integrity Contract (Candidate == Final Artifact)</text>
        <rect x="350" y="4" width="52" height="18" rx="2" fill="#064e3b"/>
        <text x="376" y="16" fill="#34d399" font-size="9" font-weight="800" text-anchor="middle">PASS</text>
      </g>

      <!-- Row 5: Completeness Contract -->
      <g transform="translate(0, 142)">
        <rect x="0" y="0" width="412" height="26" rx="4" fill="#1f1f23"/>
        <text x="10" y="17" fill="#e4e4e7" font-size="10">5. Completeness Contract (100% Redaction Execution)</text>
        <rect x="350" y="4" width="52" height="18" rx="2" fill="#064e3b"/>
        <text x="376" y="16" fill="#34d399" font-size="9" font-weight="800" text-anchor="middle">PASS</text>
      </g>
    </g>

    <!-- Adversarial Red-Team Probe Results -->
    <g transform="translate(14, 230)">
      <text x="0" y="12" fill="#a1a1aa" font-size="10" font-weight="700">ADVERSARIAL RED-TEAM PROBES (7 OF 7 VERIFIED)</text>
      <rect x="0" y="20" width="412" height="120" rx="4" fill="#131316" stroke="#27272a"/>
      
      <text x="12" y="38" fill="#10b981" font-size="10" font-family="'Cascadia Code', monospace">● Probe_MetadataClean     [PASS]  0 keys retained (L3)</text>
      <text x="12" y="54" fill="#10b981" font-size="10" font-family="'Cascadia Code', monospace">● Probe_ThumbnailClean    [PASS]  0 residual streams (L3)</text>
      <text x="12" y="70" fill="#10b981" font-size="10" font-family="'Cascadia Code', monospace">● Probe_FaceRedteam_DNN   [PASS]  0 faces detected (L3)</text>
      <text x="12" y="86" fill="#10b981" font-size="10" font-family="'Cascadia Code', monospace">● Probe_PlateRedteam_Otsu [PASS]  0 plates detected (L2)</text>
      <text x="12" y="102" fill="#10b981" font-size="10" font-family="'Cascadia Code', monospace">● Probe_TextRedteam_Grad  [PASS]  0 text detected (L3)</text>
      <text x="12" y="118" fill="#10b981" font-size="10" font-family="'Cascadia Code', monospace">● Probe_CodeRedteam_Multi [PASS]  0 codes detected (L2)</text>
    </g>

    <!-- Signed Provenance Manifest -->
    <g transform="translate(14, 385)">
      <text x="0" y="12" fill="#a1a1aa" font-size="10" font-weight="700">CRYPTOGRAPHIC PROVENANCE (Ed25519 SIGNED)</text>
      <rect x="0" y="20" width="412" height="100" rx="4" fill="#131316" stroke="#27272a"/>
      <text x="12" y="38" fill="#71717a" font-size="10" font-family="'Cascadia Code', monospace">Domain:     VEILFRAME-IDENTITY-V1 / EVIDENCE-V1</text>
      <text x="12" y="54" fill="#71717a" font-size="10" font-family="'Cascadia Code', monospace">Key ID:     veilframe-signer-primary (Ed25519)</text>
      <text x="12" y="70" fill="#71717a" font-size="10" font-family="'Cascadia Code', monospace">Hash:       sha256:e3b0c44298fc1c149afbf4c8996fb924...</text>
      <text x="12" y="86" fill="#10b981" font-size="10" font-family="'Cascadia Code', monospace">Signature:  VALID (512-bit Edwards curve)</text>
      <text x="12" y="102" fill="#3b82f6" font-size="10" font-family="'Cascadia Code', monospace">State:      COMMITTED -> Output verified</text>
    </g>
  </g>
</svg>
