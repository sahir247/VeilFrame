# Mobile (Android & iOS) Rules
rules:
  - id: "mobile.android_build"
    ecosystems: ["android", "mobile", "flutter", "react-native"]
    patterns:
      - ".externalNativeBuild/"
      - ".cxx/"
      - "captures/"
      - "*/build/"
    classification: "BUILD_OUTPUT"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Android NDK native build artifacts and profiling captures"
    priority: "ECOSYSTEM"

  - id: "mobile.packages"
    ecosystems: ["android", "ios", "mobile"]
    patterns:
      - "*.apk"
      - "*.aab"
      - "*.dex"
      - "*.ipa"
    classification: "BINARY"
    action: "DESCRIBE"
    confidence: 1.0
    reason: "Packaged mobile application artifact"
    priority: "ECOSYSTEM"

  - id: "mobile.android_manifests"
    ecosystems: ["android", "mobile"]
    patterns:
      - "AndroidManifest.xml"
      - "proguard-rules.pro"
    classification: "MANIFEST"
    action: "INCLUDE"
    confidence: 1.0
    reason: "Android manifest and Proguard configuration"
    priority: "ECOSYSTEM"
