# Game Engine Ecosystem Rules (Unity, Unreal Engine, Godot)
rules:
  - id: "game.unity_temp"
    ecosystems: ["unity", "game"]
    patterns:
      - "Library/"
      - "Temp/"
      - "Logs/"
      - "obj/"
      - "Build/"
      - "Builds/"
      - "MemoryCaptures/"
      - "UserSettings/"
    classification: "BUILD_OUTPUT"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Unity engine generated library cache, temporary state, and user settings"
    priority: "ECOSYSTEM"

  - id: "game.unity_source"
    ecosystems: ["unity", "game"]
    patterns:
      - "Assets/"
      - "Packages/"
      - "ProjectSettings/"
    classification: "SOURCE"
    action: "INCLUDE"
    confidence: 0.95
    reason: "Unity project assets, package references, and project settings"
    priority: "ECOSYSTEM"

  - id: "game.unreal_artifacts"
    ecosystems: ["unreal", "game"]
    patterns:
      - "Binaries/"
      - "DerivedDataCache/"
      - "Intermediate/"
      - "Saved/"
    classification: "BUILD_OUTPUT"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Unreal Engine intermediate shaders, caches, and binaries"
    priority: "ECOSYSTEM"

  - id: "game.unreal_source"
    ecosystems: ["unreal", "game"]
    patterns:
      - "Source/"
      - "Config/"
      - "Content/"
      - "Plugins/"
      - "*.uproject"
      - "*.uplugin"
    classification: "SOURCE"
    action: "INCLUDE"
    confidence: 0.95
    reason: "Unreal Engine project source, definitions, and config"
    priority: "ECOSYSTEM"

  - id: "game.godot"
    ecosystems: ["godot", "game"]
    patterns:
      - ".godot/"
    classification: "CACHE"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Godot 4 project import cache"
    priority: "ECOSYSTEM"

  - id: "game.godot_source"
    ecosystems: ["godot", "game"]
    patterns:
      - "project.godot"
      - "*.gd"
      - "*.tscn"
      - "*.tres"
    classification: "SOURCE"
    action: "INCLUDE"
    confidence: 0.95
    reason: "Godot project configuration, GDScript source, and scenes"
    priority: "ECOSYSTEM"
