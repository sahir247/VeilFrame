# C Ecosystem Rules
rules:
  - id: "c.cmake_artifacts"
    ecosystems: ["c", "cpp", "cmake"]
    patterns:
      - "CMakeFiles/"
      - "CMakeCache.txt"
      - "cmake_install.cmake"
      - "CTestTestfile.cmake"
      - "install_manifest.txt"
      - "cmake-build-*/"
    classification: "BUILD_OUTPUT"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "CMake build generator artifacts and cache"
    priority: "ECOSYSTEM"

  - id: "c.compiled_objects"
    ecosystems: ["c", "cpp"]
    patterns:
      - "*.o"
      - "*.obj"
      - "*.a"
      - "*.lib"
      - "*.so"
      - "*.so.*"
      - "*.dylib"
      - "*.dll"
      - "*.pdb"
      - "*.dSYM/"
      - "*.ilk"
    classification: "COMPILED"
    action: "EXCLUDE"
    confidence: 0.98
    reason: "Compiled C object, library, or debug symbol"
    priority: "ECOSYSTEM"

  - id: "c.autotools_cache"
    ecosystems: ["c", "cpp"]
    patterns:
      - "autom4te.cache/"
      - ".deps/"
      - ".libs/"
    classification: "CACHE"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Autotools dependency tracking and build cache"
    priority: "ECOSYSTEM"

  - id: "c.build_configs"
    ecosystems: ["c", "cpp", "cmake"]
    patterns:
      - "CMakeLists.txt"
      - "Makefile"
      - "Makefile.am"
      - "Makefile.in"
      - "configure"
      - "configure.ac"
    classification: "CONFIG"
    action: "INCLUDE"
    confidence: 0.95
    reason: "C build and configuration script"
    priority: "ECOSYSTEM"

  - id: "c.source"
    ecosystems: ["c"]
    patterns:
      - "*.c"
      - "*.h"
    classification: "SOURCE"
    action: "INCLUDE"
    confidence: 0.95
    reason: "C source code or header"
    priority: "ECOSYSTEM"
