# Haskell Ecosystem Rules
rules:
  - id: "haskell.build_artifacts"
    ecosystems: ["haskell", "cabal", "stack"]
    patterns:
      - "dist/"
      - "dist-newstyle/"
      - ".stack-work/"
      - "*.hi"
      - "*.dyn_hi"
      - "*.dyn_o"
    classification: "BUILD_OUTPUT"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "GHC or Stack compilation output and interface files"
    priority: "ECOSYSTEM"

  - id: "haskell.manifests"
    ecosystems: ["haskell", "cabal", "stack"]
    patterns:
      - "*.cabal"
      - "stack.yaml"
      - "package.yaml"
      - "cabal.project"
    classification: "MANIFEST"
    action: "INCLUDE"
    confidence: 1.0
    reason: "Haskell Cabal or Stack package specification"
    priority: "ECOSYSTEM"

  - id: "haskell.source"
    ecosystems: ["haskell"]
    patterns:
      - "*.hs"
      - "*.lhs"
    classification: "SOURCE"
    action: "INCLUDE"
    confidence: 0.95
    reason: "Haskell source code"
    priority: "ECOSYSTEM"
