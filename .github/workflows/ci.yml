name: VeilFrame CI & Release Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies & Graphics Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libegl1 \
            libgl1 \
            libopengl0 \
            libglx-mesa0 \
            libglu1-mesa \
            libxrender1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xkb1

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress

      - name: Verify FFmpeg Installation
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install -e .

      # Core test suite
      - name: Run Test Suite
        run: |
          python -m unittest discover tests -v

      - name: Test Independent Manifest Verifier Example
        run: |
          python -c "
          import tempfile, subprocess, sys
          from pathlib import Path
          from veilframe.core.validator import evaluate_visual_quality, generate_ed25519_signed_manifest
          from tests.test_quality_gate import TestProductionQualityGate

          TestProductionQualityGate.setUpClass()
          t = TestProductionQualityGate()
          report = evaluate_visual_quality(t.ref_video, t.ref_video, canonical_w=320, canonical_h=240)
          td = Path(tempfile.mkdtemp())
          paths = generate_ed25519_signed_manifest(report, td)
          cmd = [sys.executable, 'examples/verify_manifest.py', str(paths[0]), str(paths[2]), str(paths[3]), '--expected-fingerprint', report.public_key_fingerprint, '--video-file', str(t.ref_video)]
          subprocess.run(cmd, check=True)
          "

  # ------------------------------------------------------------------ #
  # Production Release Gate: runs on main pushes, tags & releases.     #
  # Enforces clean test suite execution and manifest verification.      #
  # ------------------------------------------------------------------ #
  release-gate:
    name: Production Release Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v')
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Graphics Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libglx-mesa0

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install -e .

      - name: Run Test Suite
        run: |
          python -m unittest discover tests -v

  # ------------------------------------------------------------------ #
  # Production Release Assets: builds exe and python dist, uploads      #
  # to GitHub Releases when a version tag is pushed or published.      #
  # ------------------------------------------------------------------ #
  publish-release:
    name: Build & Publish Release Assets
    runs-on: windows-latest
    needs: [test, release-gate]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress

      - name: Install Dependencies & Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt build pyinstaller
          pip install -e .

      - name: Build Python Distribution (Wheel & Sdist)
        run: python -m build

      - name: Build Standalone Windows Executable
        run: pyinstaller --noconfirm --clean VeilFrame.spec

      - name: Generate Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist | Where-Object { $_.Extension -in '.exe', '.whl', '.gz' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          } | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VeilFrame.exe
            dist/veilframe-*.whl
            dist/veilframe-*.tar.gz
            dist/SHA256SUMS.txt
            RELEASE_NOTES.md
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
