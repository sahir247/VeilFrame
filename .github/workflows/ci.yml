name: Privacy Video Cleaner CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg-full --no-progress

      - name: Verify FFmpeg Installation
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite (23 Unit, Integration, Adversarial & Boundary Tests)
        run: |
          python -m unittest discover tests

      - name: Test Independent Manifest Verifier Example
        run: |
          python -c "
          import tempfile, subprocess
          from pathlib import Path
          from privacy_cleaner.core.validator import evaluate_visual_quality, generate_ed25519_signed_manifest
          from tests.test_quality_gate import TestProductionQualityGate

          TestProductionQualityGate.setUpClass()
          t = TestProductionQualityGate()
          report = evaluate_visual_quality(t.ref_video, t.ref_video, canonical_w=320, canonical_h=240)
          td = Path(tempfile.mkdtemp())
          paths = generate_ed25519_signed_manifest(report, td)
          cmd = ['python', 'examples/verify_manifest.py', str(paths[0]), str(paths[2]), str(paths[3]), '--expected-fingerprint', report.public_key_fingerprint, '--video-file', str(t.ref_video)]
          subprocess.run(cmd, check=True)
          "
