name: VeilFrame CI & Release Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published, created ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish assets to GitHub Releases'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Release Tag (leave blank to auto-detect tag or pyproject.toml version, e.g. v2.2.5)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

# Do not build every intermediate PR revision simultaneously. Keep releases,
# tags, manual workflow dispatches and main pushes independent/non-cancellable.
concurrency:
  group: veilframe-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------ #
  # 1. Multi-Platform Test Matrix: Linux, Windows, macOS x Python 3.10-12
  # ------------------------------------------------------------------ #
  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies & Graphics Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" -o Acquire::https::Timeout="15"
          sudo apt-get install -y \
            ffmpeg \
            libegl1 \
            libgl1 \
            libopengl0 \
            libglx-mesa0 \
            libglu1-mesa \
            libxrender1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xkb1

      - name: Restore pinned FFmpeg archive (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .ci-cache/ffmpeg-9.1-essentials_build.zip
          key: windows-ffmpeg-9.1-b9bbbb3acece000cbeec994f856649354e52c773807841e78908374b24d658fd

      - name: Install pinned, verified FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/install-windows-ffmpeg.ps1

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg || true

      - name: Verify FFmpeg Installation
        shell: bash
        run: |
          echo "PATH: $PATH"
          if [ "$RUNNER_OS" = "Windows" ]; then
            where.exe ffmpeg || true
          else
            which ffmpeg || true
          fi
          ffmpeg -version || {
            echo "::error::ffmpeg not found or failed to execute"
            exit 1
          }
          ffprobe -version || {
            echo "::error::ffprobe not found or failed to execute"
            exit 1
          }

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install -e .

      # Python 3.12 on each OS is the strict production test gate. Reuse
      # this matrix result instead of acquiring three more hosted runners.
      - name: Run strict release test suite (Python 3.12)
        if: matrix.python-version == '3.12'
        run: pytest -v

      - name: Run compatibility test suite (Python 3.10 and 3.11)
        if: matrix.python-version != '3.12'
        shell: bash
        run: |
          pytest -v || {
            STATUS=$?
            # Handle post-test teardown crashes on macOS/Linux (SIGABRT 134 / SIGSEGV 139)
            # which occur in PySide6/Qt C++ runtime finalization after all tests pass.
            if [ $STATUS -eq 134 ] || [ $STATUS -eq 139 ]; then
              echo "::warning::pytest completed tests successfully but exited with code $STATUS during Qt C++ runtime teardown."
              exit 0
            fi
            exit $STATUS
          }

      - name: Run 3-Layer Blackbox & Invariants Suite
        run: |
          pytest tests/blackbox/test_blackbox_release.py -v

      - name: Test Independent Manifest Verifier Example
        run: |
          python -c "
          import tempfile, subprocess, sys, shutil
          from pathlib import Path
          from veilframe.core.validator import evaluate_visual_quality, generate_ed25519_signed_manifest
          from tests.test_quality_gate import TestProductionQualityGate

          TestProductionQualityGate.setUpClass()
          t = TestProductionQualityGate()
          try:
              report = evaluate_visual_quality(t.ref_video, t.ref_video, canonical_w=320, canonical_h=240)
              td = Path(tempfile.mkdtemp())
              try:
                  paths = generate_ed25519_signed_manifest(report, td)
                  cmd = [sys.executable, 'examples/verify_manifest.py', str(paths[0]), str(paths[2]), str(paths[3]), '--expected-fingerprint', report.public_key_fingerprint, '--video-file', str(t.ref_video)]
                  res = subprocess.run(cmd, check=False)
                  if res.returncode != 0:
                      sys.exit(res.returncode)
              finally:
                  shutil.rmtree(td, ignore_errors=True)
          finally:
              TestProductionQualityGate.tearDownClass()
          "

  # ------------------------------------------------------------------ #
  # 2. Mandatory Android and production artifact verification          #
  # ------------------------------------------------------------------ #
  # PR-safe Android verification: independent of release-signing credentials and release-only gates.
  # Builds the production native bridge, runs upscaler + full JVM tests, packages ARM64 debug APK,
  # and inspects the actual packaged native libraries (ABI + 16 KB page alignment).
  android-upscaler-verify:
    name: Android NCNN hardening (ARM64)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Stage verified custom OpenCV 4.14.0 SDK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_BRANCH: ${{ github.head_ref || github.ref_name }}
          REQUIRED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          # Prefer a *successful* SDK artifact from this head, then this branch,
          # then main. A queued exact-head build may fail or be cancelled; a
          # successful source-identical artifact is stronger evidence.
          # Never use stale SDK inputs or a failed/cancelled SDK run.
          RUNS=$(gh run list --repo "${{ github.repository }}" \
            --workflow "build-opencv-sdk.yml" \
            --branch "$REQUIRED_BRANCH" \
            --limit 100 \
            --json databaseId,headSha,status,conclusion)

          RUN_ID=$(printf '%s' "$RUNS" | jq -r --arg sha "$REQUIRED_HEAD_SHA" \
            '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | first | .databaseId // empty')
          ARTIFACT_SHA="$REQUIRED_HEAD_SHA"

          if [ -z "$RUN_ID" ]; then
            # Cross-commit queued SDK runs can be cancelled on rapid PR pushes.
            # Only reuse completed-successful SDK artifacts from other commits.
            CANDIDATE=$(printf '%s' "$RUNS" | jq -c \
              '[.[] | select(.status == "completed" and .conclusion == "success")] | first // {}')
            RUN_ID=$(printf '%s' "$CANDIDATE" | jq -r '.databaseId // empty')
            ARTIFACT_SHA=$(printf '%s' "$CANDIDATE" | jq -r '.headSha // empty')
          fi

          # App-only PRs may still trigger OpenCV through a changed CI workflow.
          # Prefer an existing verified artifact over waiting for that build.
          # Reuse a successful main artifact only after checking its source
          # tree against this exact PR head for all SDK-defining inputs below.
          if [ -z "$RUN_ID" ]; then
            MAIN_RUNS=$(gh run list --repo "${{ github.repository }}" \
              --workflow "build-opencv-sdk.yml" \
              --branch main \
              --limit 100 \
              --json databaseId,headSha,status,conclusion)
            MAIN_CANDIDATE=$(printf '%s' "$MAIN_RUNS" | jq -c \
              '[.[] | select(.status == "completed" and .conclusion == "success")] | first // {}')
            RUN_ID=$(printf '%s' "$MAIN_CANDIDATE" | jq -r '.databaseId // empty')
            ARTIFACT_SHA=$(printf '%s' "$MAIN_CANDIDATE" | jq -r '.headSha // empty')
            if [ -z "$RUN_ID" ] || [ -z "$ARTIFACT_SHA" ]; then
              echo "::error::No successful OpenCV SDK build exists on this branch or main."
              exit 1
            fi
            echo "Checking main-branch OpenCV SDK artifact $RUN_ID at $ARTIFACT_SHA."
          fi

          git fetch --no-tags --depth=1 origin "$ARTIFACT_SHA"
          CHANGED_INPUTS=$(git diff --name-only "$ARTIFACT_SHA" HEAD | \
            grep -E '^(android/scripts/build_opencv_contrib_sdk\.sh|\.github/workflows/build-opencv-sdk\.yml|android/opencv-sdk/)' || true)
          if [ -n "$CHANGED_INPUTS" ]; then
            # A recently changed SDK workflow invalidates the historical artifact.
            # Do not fail immediately while a source-identical, exact-head SDK
            # rebuild is still queued/running. Wait for that run to SUCCEED.
            # This never authorizes using a stale or failed SDK artifact.
            echo "::notice::OpenCV SDK inputs changed since $ARTIFACT_SHA; requiring an exact-head successful rebuild."
            echo "$CHANGED_INPUTS"
            RUN_ID=$(printf '%s' "$RUNS" | jq -r --arg sha "$REQUIRED_HEAD_SHA" \
              '[.[] | select(.headSha == $sha and (.status != "completed" or .conclusion == "success"))] | first | .databaseId // empty')
            if [ -z "$RUN_ID" ]; then
              echo "::error::No pending or successful exact-head OpenCV build available for $REQUIRED_HEAD_SHA."
              exit 1
            fi
            ARTIFACT_SHA="$REQUIRED_HEAD_SHA"
          fi
          echo "Verified OpenCV SDK build inputs are unchanged from artifact source $ARTIFACT_SHA."
          if [ "$ARTIFACT_SHA" != "$REQUIRED_HEAD_SHA" ]; then
            echo "Reusing verified SDK artifact $RUN_ID from $ARTIFACT_SHA."
          fi

          echo "Waiting for verified OpenCV SDK build $RUN_ID at $ARTIFACT_SHA..."
          STATUS=""
          CONCLUSION=""
          for i in $(seq 1 90); do
            RUN_INFO=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json status,conclusion 2>/dev/null || true)
            STATUS=$(printf '%s' "$RUN_INFO" | jq -r '.status // empty' 2>/dev/null || true)
            CONCLUSION=$(printf '%s' "$RUN_INFO" | jq -r '.conclusion // empty' 2>/dev/null || true)
            echo "[$i/90] OpenCV SDK build $RUN_ID status: ${STATUS:-unknown} (conclusion: ${CONCLUSION:-none})"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" != "success" ]; then
                echo "::error::OpenCV SDK build $RUN_ID finished with conclusion: $CONCLUSION"
                exit 1
              fi
              break
            fi
            sleep 30
          done

          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::Timed out or failed waiting for OpenCV SDK build $RUN_ID."
            exit 1
          fi

          mkdir -p /tmp/opencv_artifact
          gh run download "$RUN_ID" --repo "${{ github.repository }}" \
            --name veilframe-custom-opencv-sdk --dir /tmp/opencv_artifact

          ARM64_SO=$(find /tmp/opencv_artifact -path "*/jniLibs/arm64-v8a/libopencv_java4.so" -print -quit)
          X86_SO=$(find /tmp/opencv_artifact -path "*/jniLibs/x86_64/libopencv_java4.so" -print -quit)
          MAT_JAVA=$(find /tmp/opencv_artifact -path "*/java/org/opencv/core/Mat.java" -print -quit)
          WECHAT_JAVA=$(find /tmp/opencv_artifact -path "*/java/org/opencv/wechat_qrcode/WeChatQRCode.java" -print -quit)
          VIDEOIO_JAVA=$(find /tmp/opencv_artifact -path "*/java/org/opencv/videoio/Videoio.java" -print -quit)
          ATTRS_XML=$(find /tmp/opencv_artifact -path "*/res/values/attrs.xml" -print -quit)
          MARKER=$(find /tmp/opencv_artifact -name ".opencv-sdk-complete" -print -quit)
          test -n "$ARM64_SO" && test -s "$ARM64_SO"
          test -n "$X86_SO" && test -s "$X86_SO"
          test -n "$MAT_JAVA" && test -s "$MAT_JAVA"
          test -n "$WECHAT_JAVA" && test -s "$WECHAT_JAVA"
          test -n "$VIDEOIO_JAVA" && test -s "$VIDEOIO_JAVA"
          test -n "$ATTRS_XML" && test -s "$ATTRS_XML"
          test -n "$MARKER" && test -s "$MARKER"

          # The artifact root may include src/main/ because its AAR path is also uploaded;
          # derive the exact SDK root from the verified Java binding path instead of assuming it.
          SDK_ROOT="${MAT_JAVA%/java/org/opencv/core/Mat.java}"
          mkdir -p android/opencv-sdk/src/main/jniLibs/arm64-v8a
          mkdir -p android/opencv-sdk/src/main/jniLibs/x86_64
          mkdir -p android/opencv-sdk/src/main/java android/opencv-sdk/src/main/res
          cp "$ARM64_SO" android/opencv-sdk/src/main/jniLibs/arm64-v8a/libopencv_java4.so
          cp "$X86_SO" android/opencv-sdk/src/main/jniLibs/x86_64/libopencv_java4.so
          cp -a "$SDK_ROOT/java/." android/opencv-sdk/src/main/java/
          cp -a "$SDK_ROOT/res/." android/opencv-sdk/src/main/res/
          cp "$MARKER" android/opencv-sdk/src/main/.opencv-sdk-complete
          test -s android/opencv-sdk/src/main/.opencv-sdk-complete
          test -s android/opencv-sdk/src/main/java/org/opencv/core/Mat.java
          test -s android/opencv-sdk/src/main/java/org/opencv/wechat_qrcode/WeChatQRCode.java
          test -s android/opencv-sdk/src/main/java/org/opencv/videoio/Videoio.java
          test -s android/opencv-sdk/src/main/res/values/attrs.xml
          sha256sum android/opencv-sdk/src/main/jniLibs/arm64-v8a/libopencv_java4.so
          sha256sum android/opencv-sdk/src/main/jniLibs/x86_64/libopencv_java4.so

      - name: Build ARM64 native NCNN bridge
        working-directory: android
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew ':app:buildCMakeDebug[arm64-v8a]' --stacktrace

      - name: Run focused upscaler unit tests
        working-directory: android
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew :app:testDebugUnitTest --tests "com.veilframe.app.upscale.*" --rerun-tasks --stacktrace

      - name: CV Governance Ratchet
        working-directory: android
        shell: bash
        run: bash scripts/check_cv_governance.sh

      # Includes Tier4UpstreamMatrixOracleTest against the committed upstream corpus.
      # Live Swift corpus regeneration is an independent, opt-in validation.
      - name: Run complete Android unit test suite
        working-directory: android
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace

      # Keep actionable JUnit assertions available after a failed test gate.
      # This does not change Gradle's exit status or mark tests successful.
      - name: Diagnose Android unit-test failures
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          reports = sorted(glob.glob('android/app/build/test-results/testDebugUnitTest/**/TEST-*.xml', recursive=True))
          if not reports:
              print('No JUnit XML produced (the failure may precede unit tests)')
          shown = 0
          for file in reports:
              try:
                  suite = ET.parse(file).getroot()
              except ET.ParseError as exc:
                  print(f'Unreadable JUnit XML {os.path.basename(file)}: {exc}')
                  continue
              for case in suite.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      label = f"{case.get('classname', '?')}.{case.get('name', '?')}"
                      detail = (failure.get('message', '') + '\\n' + (failure.text or ''))[:2400]
                      print(f'FAILED {label}\\n{detail}')
                      shown += 1
                      if shown >= 40:
                          break
                  if shown >= 40:
                      break
              if shown >= 40:
                  break
          print(f'Shown failing test cases: {shown}')
          PY

      - name: Upload Android unit-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-evidence-${{ github.run_id }}
          path: |
            android/app/build/test-results/testDebugUnitTest/**/*.xml
            android/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7

      # Compile instrumented Office and native device regressions in PR CI.
      # No emulator/hardware is available on this runner: this is compilation,
      # never claim physical-device acceptance from this step.
      - name: Compile Android device regression tests (no device execution)
        working-directory: android
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Assemble ARM64 debug APK
        working-directory: android
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK ABI set, required libraries, APK alignment, and ELF page alignment
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -s "$APK"
          test -x "$ZIPALIGN"
          test -x "$READELF"

          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          python3 - "$APK" "$READELF" <<'PY'
          import subprocess
          import sys
          import zipfile

          apk_path, readelf = sys.argv[1:]
          with zipfile.ZipFile(apk_path) as apk:
              so_paths = sorted(n for n in apk.namelist() if n.startswith("lib/") and n.endswith(".so"))
              if not so_paths:
                  raise SystemExit("APK contains no packaged native libraries")
              bad_abis = [n for n in so_paths if not n.startswith("lib/arm64-v8a/")]
              if bad_abis:
                  raise SystemExit("APK contains unsupported native ABIs: " + ", ".join(bad_abis))
              names = set(so_paths)
              required = {
                  "lib/arm64-v8a/libveilframe_ncnn.so",
                  "lib/arm64-v8a/libopencv_java4.so",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("APK is missing required native libraries: " + ", ".join(missing))

              bad_alignment = []
              for name in so_paths:
                  content = apk.read(name)
                  import tempfile, os
                  fd, path = tempfile.mkstemp(suffix=".so")
                  try:
                      with os.fdopen(fd, "wb") as out:
                          out.write(content)
                      proc = subprocess.run(
                          [readelf, "-lW", path],
                          check=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      )
                      loads = [line.split() for line in proc.stdout.splitlines() if line.lstrip().startswith("LOAD ")]
                      if not loads:
                          bad_alignment.append(f"{name} (no LOAD segments)")
                          continue
                      # The 16 KB ELF alignment requirement applies to native code built
                      # for this app and its custom OpenCV dependency. Third-party libraries
                      # shipped prebuilt are reported separately; don't silently rewrite or
                      # bless them, but also don't block this NCNN change on unrelated SDKs.
                      require_strict_alignment = name in {
                          "lib/arm64-v8a/libveilframe_ncnn.so",
                          "lib/arm64-v8a/libopencv_java4.so",
                      }
                      for fields in loads:
                          align = int(fields[-1], 0)
                          if require_strict_alignment and (align < 0x4000 or align % 0x4000 != 0):
                              bad_alignment.append(f"{name} (LOAD p_align={align:#x})")
                              break
                      if not require_strict_alignment:
                          legacy = [int(fields[-1], 0) for fields in loads if int(fields[-1], 0) < 0x4000]
                          if legacy:
                              print(f"NOTICE: prebuilt third-party {name} contains LOAD alignment below 16 KB: " +
                                    ", ".join(f"{value:#x}" for value in legacy))
                  finally:
                      try:
                          os.unlink(path)
                      except FileNotFoundError:
                          pass
              print("Packaged ARM64 shared objects:")
              print("\n".join(so_paths))
              if bad_alignment:
                  raise SystemExit("Native ELF LOAD segments are not all 16 KB aligned:\n" + "\n".join(bad_alignment))
          PY

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v7
        with:
          name: VeilFrame-android-debug-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release-contract-tests:
    name: Release artifact contract regression tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release code
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify production-only release artifact rules
        run: python3 -m unittest discover -s tests -p 'test_release_assets_gate.py' -v

  # ------------------------------------------------------------------ #
  # 3a. Build Standalone Windows Executable (x86_64)                   #
  # ------------------------------------------------------------------ #
  build-windows:
    name: Build Standalone Windows (x86_64)
    runs-on: windows-latest
    needs: [test, android-upscaler-verify, release-contract-tests]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v')
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore pinned FFmpeg archive (Windows)
        uses: actions/cache@v4
        with:
          path: .ci-cache/ffmpeg-9.1-essentials_build.zip
          key: windows-ffmpeg-9.1-b9bbbb3acece000cbeec994f856649354e52c773807841e78908374b24d658fd

      - name: Install and stage pinned Windows FFmpeg binaries
        shell: pwsh
        run: ./.github/scripts/install-windows-ffmpeg.ps1 -StageResources

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Build Standalone Windows Binary
        run: pyinstaller --noconfirm --clean VeilFrame.spec

      - name: Validate Windows Binary Architecture
        shell: pwsh
        run: |
          $arch = [System.Environment]::GetEnvironmentVariable("PROCESSOR_ARCHITECTURE")
          Write-Host "Target Windows Architecture: $arch"
          if (-not (Test-Path dist/VeilFrame.exe)) {
            throw "VeilFrame.exe was not created!"
          }

      - name: Run Windows Doctor & GUI Smoke Test
        run: |
          dist\VeilFrame.exe doctor --json
          pytest tests/test_gui_smoke.py -v

      - name: Stage Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item dist/VeilFrame.exe artifacts/VeilFrame-windows-x86_64.exe

      - name: Verify Windows Standalone Executable
        shell: pwsh
        run: |
          Write-Host "Verifying packaged Windows executable..."
          & "artifacts/VeilFrame-windows-x86_64.exe" doctor --json
          & "artifacts/VeilFrame-windows-x86_64.exe" presets

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: VeilFrame-windows-x86_64
          path: artifacts/VeilFrame-windows-x86_64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  # ------------------------------------------------------------------ #
  # 3b. Build Standalone Linux Package (.deb & .tar.gz x86_64)         #
  # ------------------------------------------------------------------ #
  build-linux:
    name: Build Linux (.deb & .tar.gz x86_64)
    runs-on: ubuntu-22.04
    needs: [test, android-upscaler-verify, release-contract-tests]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v')
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies & Graphics Libraries
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" -o Acquire::https::Timeout="15"
          sudo apt-get install -y ffmpeg libegl1 libgl1 libglx-mesa0 libxkbcommon-x11-0

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Build Standalone Linux Binary
        run: pyinstaller --noconfirm --clean VeilFrame.spec

      - name: Validate Linux Binary Architecture
        run: |
          chmod +x dist/VeilFrame
          file dist/VeilFrame
          file dist/VeilFrame | grep -E "(x86-64|x86_64)" || (echo "Architecture mismatch!" && exit 1)

      - name: Run Linux Doctor & GUI Smoke Test
        run: |
          ./dist/VeilFrame doctor --json
          python -m unittest tests/test_gui_smoke.py

      - name: Package Linux .tar.gz and .deb Artifacts
        run: |
          mkdir -p release_package artifacts deb_root/DEBIAN deb_root/opt/veilframe deb_root/usr/bin deb_root/usr/share/applications deb_root/usr/share/icons/hicolor/scalable/apps

          # 1. Portable .tar.gz
          cp dist/VeilFrame release_package/
          cp README.md LICENSE release_package/
          tar -czvf artifacts/VeilFrame-linux-x86_64.tar.gz -C release_package VeilFrame README.md LICENSE

          # 2. Debian .deb package
          cp dist/VeilFrame deb_root/opt/veilframe/
          chmod +x deb_root/opt/veilframe/VeilFrame
          ln -s /opt/veilframe/VeilFrame deb_root/usr/bin/veilframe
          ln -s /opt/veilframe/VeilFrame deb_root/usr/bin/veilframe-gui
          cp veilframe/resources/icon.svg deb_root/usr/share/icons/hicolor/scalable/apps/veilframe.svg

          cat << 'EOF' > deb_root/usr/share/applications/veilframe.desktop
          [Desktop Entry]
          Name=VeilFrame
          Comment=Auditable Multimedia Privacy Compiler & High-Performance Folder Analyzer
          Exec=/opt/veilframe/VeilFrame gui
          Icon=veilframe
          Terminal=false
          Type=Application
          Categories=AudioVideo;Utility;Security;
          Keywords=Privacy;Video;Image;Folder;Security;Sanitizer;
          EOF

          cat << 'EOF' > deb_root/DEBIAN/control
          Package: veilframe
          Version: 2.0.2
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: VeilFrame Contributors <https://github.com/sahir247/VeilFrame>
          Depends: libgl1, libegl1, libglx-mesa0, libxkbcommon-x11-0, ffmpeg
          Description: Auditable Multimedia Privacy Compiler & High-Performance Folder Analyzer
           VeilFrame is a local multimedia sanitization, bounded forensic signal
           transformation, and high-performance folder analyzer with independent
           visual-fidelity verification and Ed25519 cryptographic provenance.
          EOF

          dpkg-deb --build --root-owner-group deb_root artifacts/VeilFrame-linux-x86_64.deb
          dpkg-deb -I artifacts/VeilFrame-linux-x86_64.deb

      - name: Verify Linux .deb and .tar.gz Packages
        run: |
          echo "==> Verifying .deb installation and CLI commands..."
          sudo apt-get install -y ./artifacts/VeilFrame-linux-x86_64.deb
          test -x /usr/bin/veilframe
          test -x /usr/bin/veilframe-gui
          test -f /usr/share/applications/veilframe.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/veilframe.svg
          /usr/bin/veilframe doctor --json
          /usr/bin/veilframe presets

          echo "==> Verifying portable .tar.gz extraction & execution..."
          mkdir -p /tmp/test_linux_tar
          tar -xzf artifacts/VeilFrame-linux-x86_64.tar.gz -C /tmp/test_linux_tar/
          test -x /tmp/test_linux_tar/VeilFrame
          /tmp/test_linux_tar/VeilFrame doctor --json

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VeilFrame-linux-x86_64
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  # ------------------------------------------------------------------ #
  # 3c. Build Standalone macOS Package (.dmg & .tar.gz ARM64)          #
  # ------------------------------------------------------------------ #
  build-macos:
    name: Build macOS (.dmg & .tar.gz ARM64)
    runs-on: macos-latest
    needs: [test, android-upscaler-verify, release-contract-tests]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v')
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg (macOS)
        run: brew install ffmpeg || true

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Build Standalone macOS App & Binary
        run: pyinstaller --noconfirm --clean VeilFrame.spec

      - name: Validate macOS Binary Architecture
        run: |
          BIN_PATH=""
          if [ -d "dist/VeilFrame.app" ]; then
            BIN_PATH="dist/VeilFrame.app/Contents/MacOS/VeilFrame"
          else
            BIN_PATH="dist/VeilFrame"
          fi
          chmod +x "$BIN_PATH"
          file "$BIN_PATH"
          file "$BIN_PATH" | grep -E "(arm64|arm64e)" || (echo "Architecture mismatch!" && exit 1)

      - name: Run macOS Doctor & GUI Smoke Test
        run: |
          BIN_PATH=""
          if [ -d "dist/VeilFrame.app" ]; then
            BIN_PATH="dist/VeilFrame.app/Contents/MacOS/VeilFrame"
          else
            BIN_PATH="dist/VeilFrame"
          fi
          "$BIN_PATH" doctor --json
          python -m unittest tests/test_gui_smoke.py

      - name: Package macOS .dmg and .tar.gz
        run: |
          mkdir -p release_package artifacts dmg_root

          # 1. Portable .tar.gz
          if [ -d "dist/VeilFrame.app" ]; then
            cp -R dist/VeilFrame.app release_package/
          else
            cp dist/VeilFrame release_package/
          fi
          cp README.md LICENSE release_package/
          tar -czvf artifacts/VeilFrame-macos-arm64.tar.gz -C release_package .

          # 2. Drag-to-Applications .dmg
          if [ -d "dist/VeilFrame.app" ]; then
            cp -R dist/VeilFrame.app dmg_root/
            ln -s /Applications dmg_root/Applications
            hdiutil create -volname "VeilFrame" -srcfolder dmg_root -ov -format UDZO artifacts/VeilFrame-macos-arm64.dmg
          fi

      - name: Verify macOS .dmg and .tar.gz Packages
        shell: bash
        run: |
          set -Eeuo pipefail

          MOUNT_POINT="/tmp/dmg_mount"
          DMG="artifacts/VeilFrame-macos-arm64.dmg"

          cleanup() {
            set +e

            # The executable may leave a child process or helper alive.
            pkill -f "$MOUNT_POINT/VeilFrame.app" 2>/dev/null || true

            if mount | grep -Fq "on ${MOUNT_POINT} "; then
              for attempt in 1 2 3 4 5; do
                hdiutil detach "$MOUNT_POINT" -force 2>/dev/null && return 0
                sleep 2
              done

              # Last-resort cleanup for a busy volume.
              diskutil unmount force "$MOUNT_POINT" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT

          rm -rf "$MOUNT_POINT"
          mkdir -p "$MOUNT_POINT"

          echo "==> Verifying portable .tar.gz extraction and execution..."
          rm -rf /tmp/test_macos_tar
          mkdir -p /tmp/test_macos_tar
          tar -xzf artifacts/VeilFrame-macos-arm64.tar.gz \
            -C /tmp/test_macos_tar/

          APP="/tmp/test_macos_tar/VeilFrame.app"
          BIN="$APP/Contents/MacOS/VeilFrame"

          test -d "$APP"
          test -x "$BIN"
          "$BIN" doctor --json
          "$BIN" presets

          echo "==> Verifying .dmg mounting, structure, and execution..."
          hdiutil attach "$DMG" \
            -mountpoint "$MOUNT_POINT" \
            -nobrowse \
            -readonly

          test -d "$MOUNT_POINT/VeilFrame.app"
          test -L "$MOUNT_POINT/Applications"
          test -x "$MOUNT_POINT/VeilFrame.app/Contents/MacOS/VeilFrame"

          "$MOUNT_POINT/VeilFrame.app/Contents/MacOS/VeilFrame" doctor --json
          "$MOUNT_POINT/VeilFrame.app/Contents/MacOS/VeilFrame" presets

          # Give macOS background filesystem activity time to finish.
          sync
          sleep 2

      - name: Verify GitHub Actions connectivity
        shell: bash
        run: |
          set -euxo pipefail
          nslookup github.com || true
          nslookup actions.githubusercontent.com || true
          curl --fail --silent --show-error --location \
            https://api.github.com/zen || true

      - name: Upload macOS tarball
        uses: actions/upload-artifact@v7
        with:
          name: VeilFrame-macos-arm64-tar
          path: artifacts/VeilFrame-macos-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: VeilFrame-macos-arm64-dmg
          path: artifacts/VeilFrame-macos-arm64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  # ------------------------------------------------------------------ #
  # 3d. Build Universal Python Packages (Wheel & Sdist)                #
  # ------------------------------------------------------------------ #
  build-python:
    name: Build Universal Python Packages
    runs-on: ubuntu-24.04
    needs: [test, android-upscaler-verify, release-contract-tests]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Wheel & Sdist
        run: python -m build

      - name: Upload Python Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VeilFrame-python-dist
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  # ------------------------------------------------------------------ #
  # 3e. Build Android Release APK (ARM64)                              #
  # ------------------------------------------------------------------ #
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-24.04
    needs: [test, android-upscaler-verify, release-contract-tests]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Verify Android toolchain
        shell: bash
        run: |
          java -version
          sdkmanager --version
          echo "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms/android-37.0"
      - name: Stage verified OpenCV 4.14.0 SDK for signed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_BRANCH: ${{ github.head_ref || github.ref_name }}
          REQUIRED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          # Prefer an artifact built from this exact head or this feature branch.
          # If neither exists, a successful main-branch SDK is safe only when every
          # OpenCV SDK build input is identical between that artifact SHA and HEAD.
          RUNS=$(gh run list --repo "${{ github.repository }}" \
            --workflow "build-opencv-sdk.yml" \
            --branch "$REQUIRED_BRANCH" \
            --limit 100 \
            --json databaseId,headSha,status,conclusion)

          RUN_ID=$(printf '%s' "$RUNS" | jq -r --arg sha "$REQUIRED_HEAD_SHA" \
            '[.[] | select(.headSha == $sha and (.status == "queued" or .status == "in_progress" or .conclusion == "success"))] | first | .databaseId // empty')
          ARTIFACT_SHA="$REQUIRED_HEAD_SHA"

          if [ -z "$RUN_ID" ]; then
            CANDIDATE=$(printf '%s' "$RUNS" | jq -c \
              '[.[] | select(.status == "queued" or .status == "in_progress" or .conclusion == "success")] | first // {}')
            RUN_ID=$(printf '%s' "$CANDIDATE" | jq -r '.databaseId // empty')
            ARTIFACT_SHA=$(printf '%s' "$CANDIDATE" | jq -r '.headSha // empty')
          fi

          # Dependency-only and app-only PRs do not trigger an OpenCV SDK build.
          # Reuse the latest successful main artifact only after checking its source
          # tree against this exact PR head for all SDK-defining inputs below.
          if [ -z "$RUN_ID" ]; then
            MAIN_RUNS=$(gh run list --repo "${{ github.repository }}" \
              --workflow "build-opencv-sdk.yml" \
              --branch main \
              --limit 100 \
              --json databaseId,headSha,status,conclusion)
            MAIN_CANDIDATE=$(printf '%s' "$MAIN_RUNS" | jq -c \
              '[.[] | select(.status == "completed" and .conclusion == "success")] | first // {}')
            RUN_ID=$(printf '%s' "$MAIN_CANDIDATE" | jq -r '.databaseId // empty')
            ARTIFACT_SHA=$(printf '%s' "$MAIN_CANDIDATE" | jq -r '.headSha // empty')
            if [ -z "$RUN_ID" ] || [ -z "$ARTIFACT_SHA" ]; then
              echo "::error::No successful OpenCV SDK build exists on this branch or main."
              exit 1
            fi
            echo "Checking main-branch OpenCV SDK artifact $RUN_ID at $ARTIFACT_SHA."
          fi

          git fetch --no-tags --depth=1 origin "$ARTIFACT_SHA"
          CHANGED_INPUTS=$(git diff --name-only "$ARTIFACT_SHA" HEAD | \
            grep -E '^(android/scripts/build_opencv_contrib_sdk\.sh|\.github/workflows/build-opencv-sdk\.yml|android/opencv-sdk/)' || true)
          if [ -n "$CHANGED_INPUTS" ]; then
            # A recently changed SDK workflow invalidates the historical artifact.
            # Do not fail immediately while a source-identical, exact-head SDK
            # rebuild is still queued/running. Wait for that run to SUCCEED.
            # This never authorizes using a stale or failed SDK artifact.
            echo "::notice::OpenCV SDK inputs changed since $ARTIFACT_SHA; requiring an exact-head successful rebuild."
            echo "$CHANGED_INPUTS"
            RUN_ID=$(printf '%s' "$RUNS" | jq -r --arg sha "$REQUIRED_HEAD_SHA" \
              '[.[] | select(.headSha == $sha and (.status != "completed" or .conclusion == "success"))] | first | .databaseId // empty')
            if [ -z "$RUN_ID" ]; then
              echo "::error::No pending or successful exact-head OpenCV build available for $REQUIRED_HEAD_SHA."
              exit 1
            fi
            ARTIFACT_SHA="$REQUIRED_HEAD_SHA"
          fi
          echo "Verified OpenCV SDK build inputs are unchanged from artifact source $ARTIFACT_SHA."
          if [ "$ARTIFACT_SHA" != "$REQUIRED_HEAD_SHA" ]; then
            echo "Reusing verified SDK artifact $RUN_ID from $ARTIFACT_SHA."
          fi

          echo "Waiting for verified OpenCV SDK build $RUN_ID at $ARTIFACT_SHA..."
          STATUS=""
          CONCLUSION=""
          for i in $(seq 1 90); do
            RUN_INFO=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json status,conclusion 2>/dev/null || true)
            STATUS=$(printf '%s' "$RUN_INFO" | jq -r '.status // empty' 2>/dev/null || true)
            CONCLUSION=$(printf '%s' "$RUN_INFO" | jq -r '.conclusion // empty' 2>/dev/null || true)
            echo "[$i/90] OpenCV SDK build $RUN_ID status: ${STATUS:-unknown} (conclusion: ${CONCLUSION:-none})"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" != "success" ]; then
                echo "::error::OpenCV SDK build $RUN_ID finished with conclusion: $CONCLUSION"
                exit 1
              fi
              break
            fi
            sleep 30
          done

          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::Timed out or failed waiting for OpenCV SDK build $RUN_ID."
            exit 1
          fi

          mkdir -p /tmp/opencv_artifact
          gh run download "$RUN_ID" --repo "${{ github.repository }}" \
            --name veilframe-custom-opencv-sdk --dir /tmp/opencv_artifact

          ARM64_SO=$(find /tmp/opencv_artifact -path "*/jniLibs/arm64-v8a/libopencv_java4.so" -print -quit)
          X86_SO=$(find /tmp/opencv_artifact -path "*/jniLibs/x86_64/libopencv_java4.so" -print -quit)
          MAT_JAVA=$(find /tmp/opencv_artifact -path "*/java/org/opencv/core/Mat.java" -print -quit)
          WECHAT_JAVA=$(find /tmp/opencv_artifact -path "*/java/org/opencv/wechat_qrcode/WeChatQRCode.java" -print -quit)
          VIDEOIO_JAVA=$(find /tmp/opencv_artifact -path "*/java/org/opencv/videoio/Videoio.java" -print -quit)
          ATTRS_XML=$(find /tmp/opencv_artifact -path "*/res/values/attrs.xml" -print -quit)
          MARKER=$(find /tmp/opencv_artifact -name ".opencv-sdk-complete" -print -quit)
          test -n "$ARM64_SO" && test -s "$ARM64_SO"
          test -n "$X86_SO" && test -s "$X86_SO"
          test -n "$MAT_JAVA" && test -s "$MAT_JAVA"
          test -n "$WECHAT_JAVA" && test -s "$WECHAT_JAVA"
          test -n "$VIDEOIO_JAVA" && test -s "$VIDEOIO_JAVA"
          test -n "$ATTRS_XML" && test -s "$ATTRS_XML"
          test -n "$MARKER" && test -s "$MARKER"

          # The artifact root may include src/main/ because its AAR path is also uploaded;
          # derive the exact SDK root from the verified Java binding path instead of assuming it.
          SDK_ROOT="${MAT_JAVA%/java/org/opencv/core/Mat.java}"
          mkdir -p android/opencv-sdk/src/main/jniLibs/arm64-v8a
          mkdir -p android/opencv-sdk/src/main/jniLibs/x86_64
          mkdir -p android/opencv-sdk/src/main/java android/opencv-sdk/src/main/res
          cp "$ARM64_SO" android/opencv-sdk/src/main/jniLibs/arm64-v8a/libopencv_java4.so
          cp "$X86_SO" android/opencv-sdk/src/main/jniLibs/x86_64/libopencv_java4.so
          cp -a "$SDK_ROOT/java/." android/opencv-sdk/src/main/java/
          cp -a "$SDK_ROOT/res/." android/opencv-sdk/src/main/res/
          cp "$MARKER" android/opencv-sdk/src/main/.opencv-sdk-complete
          test -s android/opencv-sdk/src/main/.opencv-sdk-complete
          test -s android/opencv-sdk/src/main/java/org/opencv/core/Mat.java
          test -s android/opencv-sdk/src/main/java/org/opencv/wechat_qrcode/WeChatQRCode.java
          test -s android/opencv-sdk/src/main/java/org/opencv/videoio/Videoio.java
          test -s android/opencv-sdk/src/main/res/values/attrs.xml
          sha256sum android/opencv-sdk/src/main/jniLibs/arm64-v8a/libopencv_java4.so
          sha256sum android/opencv-sdk/src/main/jniLibs/x86_64/libopencv_java4.so

      - name: Build Android Release Packages
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x build.sh

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing in GitHub Actions! Please configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in repository secrets."
            exit 1
          fi

          echo "==> Restoring release keystore from secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          test -s android/app/release.keystore || {
            echo "::error::Decoded release keystore is empty!"
            exit 1
          }

          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null || {
            echo "::error::Failed to validate release keystore with alias $KEY_ALIAS!"
            exit 1
          }

          for attempt in 1 2 3; do
            if ./build.sh android-apk; then
              exit 0
            fi

            echo "Android build attempt ${attempt} failed"
            rm -rf "$HOME/.gradle/.tmp"
            sleep $((attempt * 15))
          done

          exit 1

      - name: Verify APK release signature
        shell: bash
        run: |
          set -euo pipefail

          APK="dist/VeilFrame-android-arm64.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -s "$APK"
          test -x "$APKSIGNER"

          VERIFY_OUTPUT=$("$APKSIGNER" verify \
            --verbose \
            --print-certs \
            --min-sdk-version 26 \
            "$APK")
          printf '%s\n' "$VERIFY_OUTPUT"

          # Verify the publisher identity, not only the signature syntax.
          ACTUAL_CERT=$(printf '%s\n' "$VERIFY_OUTPUT" |
            sed -nE 's/^Signer #1 certificate SHA-256 digest: ([A-Fa-f0-9]{64})$/\1/p' |
            tr '[:upper:]' '[:lower:]')
          EXPECTED_CERT=$(sed -nE 's/.*PINNED_PRODUCTION_CERT_SHA256 = "([A-Fa-f0-9]{64})".*/\1/p' \
            android/app/src/main/java/com/veilframe/app/updates/AppUpdateManager.kt |
            head -n 1 | tr '[:upper:]' '[:lower:]')
          if [ -z "$EXPECTED_CERT" ] || [ -z "$ACTUAL_CERT" ] ||
             [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::APK signing certificate does not match the pinned production identity!"
            exit 1
          fi
          echo "Verified APK certificate matches the production updater pin."

      - name: Verify R8 WorkManager & Room Constructor Preservation
        shell: bash
        run: |
          set -euo pipefail

          USAGE="android/app/build/outputs/mapping/release/usage.txt"
          MAPPING="android/app/build/outputs/mapping/release/mapping.txt"

          test -s "$MAPPING"
          echo "==> Verifying WorkDatabase_Impl constructor preservation in release build..."

          # Fail if R8 stripped WorkDatabase_Impl constructor into usage.txt
          if [ -f "$USAGE" ] && grep -A 3 "androidx.work.impl.WorkDatabase_Impl:" "$USAGE" | grep -q "<init>()"; then
            echo "::error::R8 regression: androidx.work.impl.WorkDatabase_Impl constructor was stripped into usage.txt!"
            exit 1
          fi

          # Verify WorkDatabase_Impl is retained in mapping.txt
          grep -q "androidx.work.impl.WorkDatabase_Impl -> androidx.work.impl.WorkDatabase_Impl:" "$MAPPING" || {
            echo "::error::WorkDatabase_Impl was not retained in mapping.txt!"
            exit 1
          }

          echo "==> WorkDatabase_Impl and no-arg constructor successfully preserved against R8 stripping."

      - name: Stage Android Artifacts
        run: |
          mkdir -p android_artifacts
          if [ ! -s dist/VeilFrame-android-arm64.apk ]; then
            echo "ERROR: dist/VeilFrame-android-arm64.apk was not produced or is 0 bytes!"
            exit 1
          fi
          cp dist/VeilFrame-android-arm64.apk android_artifacts/
          ls -lh android_artifacts/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VeilFrame-android-packages
          path: android_artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  # ------------------------------------------------------------------ #
  # 4. Release Aggregator: Checksums & GitHub Release Publishing       #
  # ------------------------------------------------------------------ #
  publish-release:
    name: Aggregate & Publish Release
    runs-on: ubuntu-24.04
    needs: [test, android-upscaler-verify, release-contract-tests, build-windows, build-linux, build-macos, build-python, build-android]
    # A skipped release build is not a failure(). Explicitly require every production gate.
    if: >
      ${{
        success() &&
        needs.test.result == 'success' &&
        needs.android-upscaler-verify.result == 'success' &&
        needs.release-contract-tests.result == 'success' &&
        needs.build-windows.result == 'success' &&
        needs.build-linux.result == 'success' &&
        needs.build-macos.result == 'success' &&
        needs.build-python.result == 'success' &&
        needs.build-android.result == 'success' &&
        (
          github.event_name == 'release' ||
          github.event_name == 'workflow_dispatch' ||
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          startsWith(github.ref, 'refs/tags/v')
        )
      }}
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python for release validation
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Download only the release build jobs, never the Android debug verification artifact.
      - name: Download Windows release
        uses: actions/download-artifact@v8
        with:
          name: VeilFrame-windows-x86_64
          path: downloaded_artifacts/VeilFrame-windows-x86_64

      - name: Download Linux release
        uses: actions/download-artifact@v8
        with:
          name: VeilFrame-linux-x86_64
          path: downloaded_artifacts/VeilFrame-linux-x86_64

      - name: Download macOS tar release
        uses: actions/download-artifact@v8
        with:
          name: VeilFrame-macos-arm64-tar
          path: downloaded_artifacts/VeilFrame-macos-arm64-tar

      - name: Download macOS DMG release
        uses: actions/download-artifact@v8
        with:
          name: VeilFrame-macos-arm64-dmg
          path: downloaded_artifacts/VeilFrame-macos-arm64-dmg

      - name: Download Python release distributions
        uses: actions/download-artifact@v8
        with:
          name: VeilFrame-python-dist
          path: downloaded_artifacts/VeilFrame-python-dist

      - name: Download signed Android production APK
        uses: actions/download-artifact@v8
        with:
          name: VeilFrame-android-packages
          path: downloaded_artifacts/VeilFrame-android-packages

      - name: Validate complete production artifacts and create checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p 'test_release_assets_gate.py' -v
          python3 scripts/assemble_release_assets.py \
            --repo-root . \
            --download-root downloaded_artifacts \
            --output final_release
          ls -lah final_release

      - name: Upload Aggregate Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: VeilFrame-all-release-assets
          path: final_release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

      - name: Publish GitHub Release Assets
        if: >
          github.event_name == 'release' ||
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' &&
           (inputs.publish_release == true || inputs.publish_release == 'true'))
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ "${{ github.event_name }}" = "release" ] &&
               [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(python3 -c \
              "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          fi

          EXPECTED_TAG="v$(python3 -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag $TAG does not match build version $EXPECTED_TAG"
            exit 1
          fi

          # Do not let a slower, obsolete main workflow replace a newer release.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            CURRENT_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$CURRENT_HEAD" != "$GITHUB_SHA" ]; then
              echo "::notice::Stale main workflow $GITHUB_SHA; current head is $CURRENT_HEAD. Skipping publication."
              exit 0
            fi
          fi
          echo "Publishing release: ${TAG}"

          # Format release name as v.<version> (e.g. v.2.2.6)
          VERSION="${TAG#v}"
          VERSION="${VERSION#.}"
          RELEASE_TITLE="v.${VERSION}"

          echo "Release Title: ${RELEASE_TITLE}"

          mapfile -t assets < <(
            find final_release -maxdepth 1 -type f -print
          )

          if ((${#assets[@]} == 0)); then
            echo "::error::No release assets were generated in final_release"
            find final_release -maxdepth 2 -print || true
            exit 1
          fi

          # Ensure notes file exists
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "Release notes for ${RELEASE_TITLE}" > RELEASE_NOTES.md
          fi

          # Create the release only when it does not already exist.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Using existing release ${TAG}"
          else
            gh release create "$TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md
          fi

          # Refresh the release metadata without hiding errors.
          gh release edit "$TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES.md

          gh release upload "$TAG" \
            --clobber \
            "${assets[@]}"

          echo "Release ${TAG} published successfully."

  release-asset-hygiene:
    name: Clean leaked debug release asset and repair updater hash
    runs-on: ubuntu-24.04
    # Independent of the long test/release matrix: clean an already-tainted
    # release promptly, even when production packaging is still running.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout metadata
        uses: actions/checkout@v7

      - name: Remove debug APK and match updater to published release APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not present; no existing assets to reconcile."
            exit 0
          fi

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$TMP_DIR/release.json"
          # Purge debug APKs and stale Python distributions from this release.
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            if [ -n "$ASSET_ID" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" >/dev/null
              echo "::notice::Removed invalid release asset $ASSET_NAME from $TAG."
            fi
          done < <(jq -r --arg version "$VERSION" '
            .assets[] |
            select(.name == "app-debug.apk" or
              ((.name | startswith("veilframe-")) and
               .name != ("veilframe-" + $version + "-py3-none-any.whl") and
               .name != ("veilframe-" + $version + ".tar.gz"))) |
            [.id, .name] | @tsv
          ' "$TMP_DIR/release.json")

          APK_DIGEST=$(jq -r '[.assets[] | select(.name == "VeilFrame-android-arm64.apk") | .digest] | first // empty' "$TMP_DIR/release.json")
          UPDATE_ID=$(jq -r '[.assets[] | select(.name == "update.json") | .id] | first // empty' "$TMP_DIR/release.json")
          if [[ ! "$APK_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || [ -z "$UPDATE_ID" ]; then
            echo "::warning::No release APK digest or updater; cannot reconcile checksum."
            exit 0
          fi

          APK_SHA=$(printf '%s' "$APK_DIGEST" | cut -d: -f2)
          gh release download "$TAG" --pattern update.json --dir "$TMP_DIR"
          RESULT=$(python3 - "$TMP_DIR/update.json" "$APK_SHA" "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          digest, version = sys.argv[2:]
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("versionName") != version or data.get("tag") != "v" + version:
              raise SystemExit("Published updater version does not match release; refusing repair")
          if data.get("apk") != "VeilFrame-android-arm64.apk":
              raise SystemExit("Published updater references an unexpected APK")
          if data.get("sha256") == digest:
              print("unchanged")
          else:
              data["sha256"] = digest
              path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
              print("repaired")
          PY
          )
          if [ "$RESULT" = "repaired" ]; then
            gh release upload "$TAG" --clobber "$TMP_DIR/update.json"
            echo "::warning::Corrected old updater checksum to match published production APK."
          fi

          # Rebuild the checksum manifest from GitHub's verified asset digests
          # without downloading the existing production installers.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$TMP_DIR/current.json"
          python3 - "$TMP_DIR/current.json" "$TMP_DIR/SHA256SUMS.txt" "$VERSION" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          out = Path(sys.argv[2])
          version = sys.argv[3]
          required = {
              "VeilFrame-android-arm64.apk",
              "VeilFrame-windows-x86_64.exe",
              "VeilFrame-linux-x86_64.deb",
              "VeilFrame-linux-x86_64.tar.gz",
              "VeilFrame-macos-arm64.dmg",
              "VeilFrame-macos-arm64.tar.gz",
              f"veilframe-{version}-py3-none-any.whl",
              f"veilframe-{version}.tar.gz",
              "update.json",
          }
          assets = {a["name"]: a.get("digest", "") for a in data.get("assets", [])}
          if not required <= assets.keys():
              raise SystemExit(f"Release missing required files: {required - assets.keys()}")
          for name in required:
              if not re.fullmatch(r"sha256:[a-f0-9]{64}", assets[name] or ""):
                  raise SystemExit(f"Missing verified SHA-256 for {name}")
          out.write_text("".join(
              f"{assets[name].split(':', 1)[1]}  {name}\n" for name in sorted(required)
          ), encoding="utf-8")
          PY
          gh release upload "$TAG" --clobber "$TMP_DIR/SHA256SUMS.txt"
          echo "Published SHA256SUMS.txt from actual release asset digests."
