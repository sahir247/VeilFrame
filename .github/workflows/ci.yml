name: VeilFrame CI & Release Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies & Graphics Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libegl1 \
            libgl1 \
            libopengl0 \
            libglx-mesa0 \
            libglu1-mesa \
            libxrender1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xkb1

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress

      - name: Verify FFmpeg Installation
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install -e .

      # Core test suite
      - name: Run Test Suite
        run: |
          python -m unittest discover tests -v

      - name: Test Independent Manifest Verifier Example
        run: |
          python -c "
          import tempfile, subprocess, sys
          from pathlib import Path
          from veilframe.core.validator import evaluate_visual_quality, generate_ed25519_signed_manifest
          from tests.test_quality_gate import TestProductionQualityGate

          TestProductionQualityGate.setUpClass()
          t = TestProductionQualityGate()
          report = evaluate_visual_quality(t.ref_video, t.ref_video, canonical_w=320, canonical_h=240)
          td = Path(tempfile.mkdtemp())
          paths = generate_ed25519_signed_manifest(report, td)
          cmd = [sys.executable, 'examples/verify_manifest.py', str(paths[0]), str(paths[2]), str(paths[3]), '--expected-fingerprint', report.public_key_fingerprint, '--video-file', str(t.ref_video)]
          subprocess.run(cmd, check=True)
          "

  # ------------------------------------------------------------------ #
  # Production Release Gate: runs on main pushes, tags & releases.     #
  # Enforces clean test suite execution and manifest verification.      #
  # ------------------------------------------------------------------ #
  release-gate:
    name: Production Release Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v')
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Graphics Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libglx-mesa0

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install -e .

      - name: Run Test Suite
        run: |
          python -m unittest discover tests -v

  # ------------------------------------------------------------------ #
  # Production Release Assets: builds exe and python dist, uploads      #
  # to GitHub Releases when a version tag is pushed or published.      #
  # ------------------------------------------------------------------ #
  publish-release:
    name: Build & Publish Release Assets
    runs-on: windows-latest
    needs: [test, release-gate]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress

      - name: Stage FFmpeg Binaries for Bundling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/ffmpeg
          New-Item -ItemType Directory -Force -Path veilframe/resources/ffmpeg
          
          # 1. Search for pre-extracted real binaries in Chocolatey / tools directories
          $realFfmpeg = Get-ChildItem -Path "C:\ProgramData\chocolatey", "C:\tools" -Recurse -Filter "ffmpeg.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 5MB } | Select-Object -First 1
          $realFfprobe = Get-ChildItem -Path "C:\ProgramData\chocolatey", "C:\tools" -Recurse -Filter "ffprobe.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 5MB } | Select-Object -First 1
          
          if ($realFfmpeg) {
            Copy-Item $realFfmpeg.FullName -Destination resources/ffmpeg/ffmpeg.exe -Force
            Copy-Item $realFfmpeg.FullName -Destination veilframe/resources/ffmpeg/ffmpeg.exe -Force
          }
          if ($realFfprobe) {
            Copy-Item $realFfprobe.FullName -Destination resources/ffmpeg/ffprobe.exe -Force
            Copy-Item $realFfprobe.FullName -Destination veilframe/resources/ffmpeg/ffprobe.exe -Force
          }
          
          # 2. Fallback: if either binary is missing or is a shim (<5MB), download official static release
          $hasFfmpeg = (Test-Path resources/ffmpeg/ffmpeg.exe) -and ((Get-Item resources/ffmpeg/ffmpeg.exe).Length -gt 5MB)
          $hasFfprobe = (Test-Path resources/ffmpeg/ffprobe.exe) -and ((Get-Item resources/ffmpeg/ffprobe.exe).Length -gt 5MB)
          
          if (-not $hasFfmpeg -or -not $hasFfprobe) {
            Write-Host "Downloading official static FFmpeg release for standalone packaging..."
            $zipPath = "$env:TEMP\ffmpeg_ci.zip"
            $expectedHash = "bbd73489c92882a8747ebafbe855fa242eb0e52701e88e2ca6f9a071192fa94e"
            Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile $zipPath
            $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
            if ($actualHash -ne $expectedHash.ToLower()) {
              throw "CRITICAL: FFmpeg download SHA-256 mismatch! Expected: $expectedHash, Actual: $actualHash"
            }
            Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg_extracted" -Force
            $extractedFfmpeg = Get-ChildItem -Path "$env:TEMP\ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Where-Object { $_.Length -gt 5MB } | Select-Object -First 1
            $extractedFfprobe = Get-ChildItem -Path "$env:TEMP\ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Where-Object { $_.Length -gt 5MB } | Select-Object -First 1
            if ($extractedFfmpeg) {
              Copy-Item $extractedFfmpeg.FullName -Destination resources/ffmpeg/ffmpeg.exe -Force
              Copy-Item $extractedFfmpeg.FullName -Destination veilframe/resources/ffmpeg/ffmpeg.exe -Force
            }
            if ($extractedFfprobe) {
              Copy-Item $extractedFfprobe.FullName -Destination resources/ffmpeg/ffprobe.exe -Force
              Copy-Item $extractedFfprobe.FullName -Destination veilframe/resources/ffmpeg/ffprobe.exe -Force
            }
          }
          
          # 3. Assert that both binaries exist and are genuine (>5MB)
          $f1 = Get-Item resources/ffmpeg/ffmpeg.exe -ErrorAction SilentlyContinue
          $f2 = Get-Item resources/ffmpeg/ffprobe.exe -ErrorAction SilentlyContinue
          if (-not $f1 -or $f1.Length -lt 5MB) {
            throw "CRITICAL: resources/ffmpeg/ffmpeg.exe is missing or invalid (<5MB)!"
          }
          if (-not $f2 -or $f2.Length -lt 5MB) {
            throw "CRITICAL: resources/ffmpeg/ffprobe.exe is missing or invalid (<5MB)!"
          }
          
          Write-Host "FFmpeg binaries staged successfully for standalone packaging:"
          Get-ChildItem resources/ffmpeg | Format-Table Name, Length

      - name: Install Dependencies & Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt build pyinstaller
          pip install -e .

      - name: Build Python Distribution (Wheel & Sdist)
        run: python -m build

      - name: Build Standalone Windows Executable
        run: pyinstaller --noconfirm --clean VeilFrame.spec

      - name: Verify Standalone Executable & Bundled FFmpeg
        run: |
          python -c "
          import subprocess, json, sys
          print('Testing standalone binary: dist/VeilFrame.exe doctor --json')
          res = subprocess.run(['dist/VeilFrame.exe', 'doctor', '--json'], capture_output=True, text=True, timeout=45)
          print('Return code:', res.returncode)
          print('STDOUT:\n', res.stdout)
          if res.stderr:
              print('STDERR:\n', res.stderr)
          if res.returncode != 0:
              print('CRITICAL: dist/VeilFrame.exe returned non-zero exit code!')
              sys.exit(1)
          if not res.stdout.strip():
              print('CRITICAL: dist/VeilFrame.exe produced empty stdout!')
              sys.exit(1)
          try:
              data = json.loads(res.stdout)
          except Exception as e:
              print(f'CRITICAL: Failed to parse doctor JSON output: {e}')
              sys.exit(1)
          ff = data.get('ffmpeg', {})
          fp = data.get('ffprobe', {})
          ff_ok = ff.get('available') or ff.get('installed')
          fp_ok = fp.get('available') or fp.get('installed')
          if not ff_ok:
              print(f'CRITICAL: FFmpeg verification failed! Info: {ff}')
              sys.exit(1)
          if not fp_ok:
              print(f'CRITICAL: FFprobe verification failed! Info: {fp}')
              sys.exit(1)
          ff_ver = ff.get('version', 'Available')
          print(f'SUCCESS: Standalone binary verified with FFmpeg ({ff_ver}) and FFprobe!')
          "

      - name: Generate Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist | Where-Object { $_.Extension -in '.exe', '.whl', '.gz' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          } | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: VeilFrame-windows-dist
          path: dist/*
          if-no-files-found: error

      - name: Upload Release Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VeilFrame.exe
            dist/veilframe-*.whl
            dist/veilframe-*.tar.gz
            dist/SHA256SUMS.txt
            RELEASE_NOTES.md
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
