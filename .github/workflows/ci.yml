name: VeilFrame CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies & Graphics Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libegl1 \
            libgl1 \
            libopengl0 \
            libglx-mesa0 \
            libglu1-mesa \
            libxrender1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xkb1

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg-full --no-progress

      - name: Verify FFmpeg Installation
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # Core test suite — no hardcoded count in the name
      # Exit criterion: 26 legacy + 3 architecture contract = 29 tests green
      - name: Run Core Test Suite
        run: |
          python -m unittest discover tests -v

      # VMAF tests skip gracefully when libvmaf is not in FFmpeg build.
      # SKIPPED != PASSED: the release gate job enforces PASS explicitly.
      - name: Check VMAF Availability
        shell: bash
        run: |
          if ffmpeg -filters 2>&1 | grep -q libvmaf; then
            echo "VMAF_AVAILABLE=true" >> $GITHUB_ENV
            echo "libvmaf detected in FFmpeg build"
          else
            echo "VMAF_AVAILABLE=false" >> $GITHUB_ENV
            echo "libvmaf NOT detected — VMAF tests will be skipped"
          fi

      - name: Run VMAF Tests (skip if libvmaf unavailable)
        run: |
          python -m unittest tests.test_vmaf -v

      - name: Test Independent Manifest Verifier Example
        run: |
          python -c "
          import tempfile, subprocess
          from pathlib import Path
          from veilframe.core.validator import evaluate_visual_quality, generate_ed25519_signed_manifest
          from tests.test_quality_gate import TestProductionQualityGate

          TestProductionQualityGate.setUpClass()
          t = TestProductionQualityGate()
          report = evaluate_visual_quality(t.ref_video, t.ref_video, canonical_w=320, canonical_h=240)
          td = Path(tempfile.mkdtemp())
          paths = generate_ed25519_signed_manifest(report, td)
          cmd = ['python', 'examples/verify_manifest.py', str(paths[0]), str(paths[2]), str(paths[3]), '--expected-fingerprint', report.public_key_fingerprint, '--video-file', str(t.ref_video)]
          subprocess.run(cmd, check=True)
          "

  # ------------------------------------------------------------------ #
  # Release gate: runs only on tagged releases.                          #
  # VMAF must be present and all VMAF tests must PASS (not skip).        #
  # SKIPPED != PASSED — this job makes that distinction explicit.        #
  # ------------------------------------------------------------------ #
  vmaf-release-gate:
    name: VMAF Release Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg with libvmaf (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1
          # Verify libvmaf is present — fail fast if not
          ffmpeg -filters 2>&1 | grep libvmaf || {
            echo "ERROR: libvmaf is required for release gate but not found in FFmpeg build"
            exit 1
          }

      - name: Install FFmpeg with libvmaf (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg-full --no-progress
          ffmpeg -filters | Select-String libvmaf
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ERROR: libvmaf is required for release gate but not found in FFmpeg build"
            exit 1
          }

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Assert libvmaf present (fail gate if absent)
        shell: bash
        run: |
          ffmpeg -filters 2>&1 | grep libvmaf || {
            echo "RELEASE GATE FAILED: libvmaf must be present for a VeilFrame release"
            exit 1
          }

      - name: Run Core Test Suite (must pass before VMAF gate)
        run: |
          python -m unittest discover tests -v

      # On release runners, VMAF tests must PASS — not skip
      - name: Run VMAF Tests (must PASS for release — SKIPPED is a failure here)
        run: |
          python -m unittest tests.test_vmaf -v
