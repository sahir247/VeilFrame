name: Build Custom OpenCV + WeChatQRCode Android SDK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/scripts/build_opencv_contrib_sdk.sh'
      - '.github/workflows/build-opencv-sdk.yml'
      - 'android/opencv-sdk/**'

jobs:
  build-opencv:
    name: Build OpenCV 4.14.0 Android SDK (ARM64 + x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 python3-pip git

      - name: Execute OpenCV Android SDK Build
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          chmod +x android/scripts/build_opencv_contrib_sdk.sh
          ./android/scripts/build_opencv_contrib_sdk.sh

      - name: Verify Staged Custom SDK Artifacts & Marker
        run: |
          echo "=== Verifying native libraries ==="
          ls -lh android/opencv-sdk/src/main/jniLibs/arm64-v8a/libopencv_java4.so
          ls -lh android/opencv-sdk/src/main/jniLibs/x86_64/libopencv_java4.so
          echo "=== Verifying ELF machine architecture ==="
          readelf -h android/opencv-sdk/src/main/jniLibs/arm64-v8a/libopencv_java4.so | grep -E "Class:|Machine:" | grep -q "AArch64"
          readelf -h android/opencv-sdk/src/main/jniLibs/x86_64/libopencv_java4.so | grep -E "Class:|Machine:" | grep -q "Advanced Micro Devices X86-64"
          echo "=== Verifying Java bindings ==="
          test -f android/opencv-sdk/src/main/java/org/opencv/core/Mat.java
          test -f android/opencv-sdk/src/main/java/org/opencv/wechat_qrcode/WeChatQRCode.java
          echo "=== Verifying Completion Marker & Forensic Provenance ==="
          test -f android/opencv-sdk/src/main/.opencv-sdk-complete
          cat android/opencv-sdk/src/main/.opencv-sdk-complete
          grep -q "Status=VERIFIED_COMPLETE" android/opencv-sdk/src/main/.opencv-sdk-complete
          grep -q "OpenCV=4.14.0" android/opencv-sdk/src/main/.opencv-sdk-complete
          grep -q "OpenCV_SHA=0654a42b10ba2dc2b0d00f73fbfb534442654ee0" android/opencv-sdk/src/main/.opencv-sdk-complete
          grep -q "Contrib_SHA=a8e9acdd94489bb2df921e64906a5efdcfdae267" android/opencv-sdk/src/main/.opencv-sdk-complete

      - name: Build & Assemble :opencv-sdk with In-Tree Custom Binaries
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :opencv-sdk:assembleRelease

      - name: Validate Application Compilation with Custom OpenCV SDK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug
          ./gradlew :app:testDebugUnitTest --tests "com.veilframe.app.cv.*"

      - name: Device Runtime Verification (WeChatQRCode RoundTrip on x86_64 Emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          script: |
            cd android
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.veilframe.app.cv.qr.WeChatQrRoundTripTest

      - name: Upload Custom OpenCV SDK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veilframe-custom-opencv-sdk
          path: |
            android/opencv-sdk/src/main/jniLibs/
            android/opencv-sdk/src/main/java/
            android/opencv-sdk/src/main/.opencv-sdk-complete
            android/opencv-sdk/build/outputs/aar/
