name: Build Custom OpenCV + WeChatQRCode Android SDK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/scripts/build_opencv_contrib_sdk.sh'
      - '.github/workflows/build-opencv-sdk.yml'
      - '.github/workflows/ci.yml'
      - 'android/opencv-sdk/**'
  # Build SDK artifacts from feature-branch changes as well.
  # CI prefers the exact head SHA and only permits same-branch reuse when SDK inputs are unchanged.
  push:
    branches: [main]
    paths:
      - 'android/scripts/build_opencv_contrib_sdk.sh'
      - '.github/workflows/build-opencv-sdk.yml'
      - 'android/opencv-sdk/**'

# Only the newest revision of a PR needs a full custom SDK rebuild.
# Earlier revisions are superseded; cancelling them avoids repeated upstream
# Maven requests and Gradle jobs on hosted runner IPs.
concurrency:
  group: opencv-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-opencv:
    name: Build OpenCV 4.14.0 Android SDK (ARM64 + x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure Swap Space (Prevent Runner OOM)
        continue-on-error: true
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile || true
          free -h

      # OpenCV 4.14 generates a standalone Gradle 8.11.1 / Kotlin 1.8.20 project.
      # Its Kotlin plugin derives jvmTarget from the build JDK, and does not
      # recognize JVM 21. Use JDK 17 exclusively for upstream SDK generation.
      - name: Set up JDK 17 for upstream OpenCV
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1 cmdline-tools;latest'

      - name: Install Host Build Dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" -o Acquire::https::Timeout="15"
          sudo apt-get install -y --no-install-recommends ninja-build python3 python3-pip git nasm
          ninja --version
          python3 --version
          git --version

      # The standalone OpenCV SDK Gradle build resolves AGP 8.6/Kotlin 1.8.20
      # independently from the app. Preserve downloaded artifacts across builds
      # to avoid repeated Maven Central bursts on hosted runner IPs.
      - name: Cache upstream and app Gradle dependencies
        uses: gradle/actions/setup-gradle@v6

      # The generated OpenCV Gradle 8.11.1/Kotlin 1.8.20 project resolves
      # plugins independently of VeilFrame. GitHub-hosted runners recently hit
      # 429 on BOTH repo.maven.apache.org and JCenter -> repo1.maven.org.
      # Google Cloud's public Maven Central mirror is documented at
      # https://maven-central.storage.googleapis.com/index.html
      # Scope the override strictly to OpenCV's standalone generated project,
      # retaining Google Maven for Android artifacts and Maven Central fallback.
      - name: Prefer public Google Maven Central mirror for generated OpenCV Gradle
        shell: bash
        run: |
          set -Eeuo pipefail
          GRADLE_DIR="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GRADLE_DIR/init.d"
          cat > "$GRADLE_DIR/init.d/veilframe-opencv-maven.gradle" <<'GRADLE'
          import org.gradle.api.artifacts.repositories.MavenArtifactRepository

          def mirrorUrl = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def mirrorOnlyOpenCv = { dir -> dir.absolutePath.contains('/.opencv_build/') }
          // Hook *existing and future* repositories: the generated project
          // adds JCenter/repo1 during evaluation, after beforeProject fires.
          def replaceLegacyCentral = { repository ->
              if (repository instanceof MavenArtifactRepository) {
                  def host = repository.url.host?.toLowerCase(java.util.Locale.ROOT)
                  if (host in ['repo1.maven.org', 'jcenter.bintray.com', 'jcenter.bintray.org']) {
                      repository.url = new URI(mirrorUrl)
                  }
              }
          }
          gradle.beforeSettings { settings ->
              if (mirrorOnlyOpenCv(settings.settingsDir)) {
                  settings.pluginManagement.repositories {
                      maven { url = uri(mirrorUrl) }
                      all { repository -> replaceLegacyCentral(repository) }
                  }
              }
          }
          gradle.beforeProject { project ->
              if (mirrorOnlyOpenCv(project.rootDir)) {
                  project.buildscript.repositories {
                      maven { url = uri(mirrorUrl) }
                      all { repository -> replaceLegacyCentral(repository) }
                  }
                  project.repositories {
                      maven { url = uri(mirrorUrl) }
                      all { repository -> replaceLegacyCentral(repository) }
                  }
              }
          }
          GRADLE

      # Avoid the generated OpenCV Android project's late wrapper download from
      # services.gradle.org. That network timeout previously aborted ninja at
      # 16/17 after C++ libraries had successfully linked.
      - name: Cache pinned Gradle 8.11.1 archive for upstream OpenCV
        uses: actions/cache@v6.1.0
        with:
          path: .ci-cache/gradle-8.11.1-bin.zip
          key: opencv-gradle-8.11.1-bin-f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6

      - name: Download and verify upstream OpenCV Gradle distribution
        shell: bash
        run: |
          set -Eeuo pipefail
          DIST="${GITHUB_WORKSPACE}/.ci-cache/gradle-8.11.1-bin.zip"
          SHA256="f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6"
          mkdir -p "$(dirname "$DIST")"
          if [ ! -f "$DIST" ] || ! echo "$SHA256  $DIST" | sha256sum --check --status; then
            rm -f "$DIST"
            success=false
            for url in \
              "https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip" \
              "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"; do
              if curl --fail --location --silent --show-error \
                --retry 3 --retry-all-errors --retry-delay 3 \
                --connect-timeout 20 --max-time 240 "$url" -o "$DIST" \
                && echo "$SHA256  $DIST" | sha256sum --check --status; then
                success=true
                break
              fi
              echo "::warning::Pinned Gradle download failed or checksum mismatch: $url"
              rm -f "$DIST"
            done
            if [ "$success" != true ]; then
              echo "::error::Could not verify Gradle 8.11.1 distribution from either host."
              exit 1
            fi
          fi
          echo "$SHA256  $DIST" | sha256sum --check
          echo "VEILFRAME_UPSTREAM_GRADLE_ZIP=$DIST" >> "$GITHUB_ENV"

      - name: Execute OpenCV Android SDK Build
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          export ANDROID_STL=c++_static
          chmod +x android/scripts/build_opencv_contrib_sdk.sh
          ./android/scripts/build_opencv_contrib_sdk.sh

      - name: Verify Staged Custom SDK Artifacts & Marker
        run: |
          echo "=== Verifying native libraries ==="
          ls -lh android/opencv-sdk/src/main/jniLibs/arm64-v8a/libopencv_java4.so
          ls -lh android/opencv-sdk/src/main/jniLibs/x86_64/libopencv_java4.so
          echo "=== Verifying ELF machine architecture ==="
          readelf -h android/opencv-sdk/src/main/jniLibs/arm64-v8a/libopencv_java4.so | grep -E "Class:|Machine:" | grep -q "AArch64"
          readelf -h android/opencv-sdk/src/main/jniLibs/x86_64/libopencv_java4.so | grep -E "Class:|Machine:" | grep -q "Advanced Micro Devices X86-64"
          echo "=== Verifying Java bindings ==="
          test -f android/opencv-sdk/src/main/java/org/opencv/core/Mat.java
          test -f android/opencv-sdk/src/main/java/org/opencv/wechat_qrcode/WeChatQRCode.java
          test -f android/opencv-sdk/src/main/java/org/opencv/videoio/Videoio.java
          echo "=== Verifying Resources ==="
          test -f android/opencv-sdk/src/main/res/values/attrs.xml
          grep -q '<declare-styleable name="CameraBridgeViewBase">' android/opencv-sdk/src/main/res/values/attrs.xml
          echo "=== Verifying Completion Marker & Build Metadata ==="
          test -f android/opencv-sdk/src/main/.opencv-sdk-complete
          cat android/opencv-sdk/src/main/.opencv-sdk-complete
          grep -q "Status=VERIFIED_COMPLETE" android/opencv-sdk/src/main/.opencv-sdk-complete
          grep -q "OpenCV=4.14.0" android/opencv-sdk/src/main/.opencv-sdk-complete
          grep -q "OpenCV_SHA=0654a42e19215ef25b1d367d822f3c630447e7c7" android/opencv-sdk/src/main/.opencv-sdk-complete
          grep -q "Contrib_SHA=a8e9acd62cabd30419dba83007f2ac0d07de5e2c" android/opencv-sdk/src/main/.opencv-sdk-complete
          grep -q "STL=c++_static" android/opencv-sdk/src/main/.opencv-sdk-complete
          grep -q "ARM64_SHA256=" android/opencv-sdk/src/main/.opencv-sdk-complete
          grep -q "X86_64_SHA256=" android/opencv-sdk/src/main/.opencv-sdk-complete

      # VeilFrame uses AGP 9 / Kotlin 2.4.21 and Robolectric 4.18.
      # Restore JDK 21 after the upstream OpenCV Gradle project has finished.
      # App bytecode stays at Java 17 (as configured in android/app/build.gradle.kts).
      - name: Set up JDK 21 for VeilFrame and Robolectric
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build & Assemble :opencv-sdk with In-Tree Custom Binaries
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :opencv-sdk:assembleRelease --no-daemon

      - name: Validate Application Compilation with Custom OpenCV SDK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          # Stage Robolectric JARs explicitly and log resolved artifact paths
          # before the test task. Any missing/corrupt jar fails the build.
          ./gradlew :app:prepareRobolectricSdkJars --no-daemon --info
          # Do not retry or suppress actual failing CV test assertions.
          ./gradlew :app:testDebugUnitTest --tests "com.veilframe.app.cv.*" --no-daemon

      - name: Upload focused CV JVM test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencv-cv-jvm-test-evidence
          path: |
            android/app/build/test-results/testDebugUnitTest/**/*.xml
            android/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore

      # Build the same application and JNI sources natively for the x86_64
      # test guest. ARM translation on API 30 aborts in its SIMD decoder.
      # Provision only the matching NCNN ABI, never replace the vendored ARM64 SDK.
      - name: Provision pinned NCNN x86_64 Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          archive="$work/ncnn.zip"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 300 "https://github.com/Tencent/ncnn/releases/download/20260526/ncnn-20260526-android-vulkan.zip" -o "$archive"
          echo "26909c92eed35afed4a966b5e9e503fcb0a529691ea3f910ec2c94a4fff52804  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$work"
          sdk="$(find "$work" -type d -name x86_64 -print -quit)"
          test -n "$sdk"
          test -s "$sdk/lib/libncnn.a"
          test -f "$sdk/lib/cmake/ncnn/ncnnConfig.cmake"
          grep -q 'set(NCNN_VERSION 20260526)' "$sdk/lib/cmake/ncnn/ncnnConfig.cmake"
          grep -q 'set(NCNN_VULKAN ON)' "$sdk/lib/cmake/ncnn/ncnnConfig.cmake"
          destination="android/app/src/main/cpp/ncnn/x86_64"
          test ! -e "$destination"
          cp -a "$sdk" "$destination"

      - name: Assemble and verify native x86_64 instrumentation APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PcvEmulatorX86=true --no-daemon
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apks = list(Path("app/build/outputs/apk/debug").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected exactly one debug APK, found {apks}")
          with zipfile.ZipFile(apks[0]) as apk:
              libs = {name for name in apk.namelist() if name.startswith("lib/") and name.endswith(".so")}
              wrong = sorted(name for name in libs if not name.startswith("lib/x86_64/"))
              required = {"lib/x86_64/" + name for name in (
                  "libopencv_java4.so", "libveilframe_ncnn.so", "libveilframe_jpeg.so"
              )}
              missing = sorted(required - libs)
              if wrong or missing:
                  raise SystemExit(f"Invalid x86_64 debug APK: wrong ABI={wrong}, missing={missing}")
              print("Verified x86_64-only debug APK:", apks[0])
          PY

      - name: Ensure Gradle Wrapper Executable Permissions
        run: |
          chmod +x ./gradlew || true
          chmod +x android/gradlew || true

      - name: Enable KVM Hardware Acceleration & Permissions
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            sudo usermod -aG kvm $USER || true
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || true

      # This is a release gate, not informational telemetry. Previously
      # continue-on-error let broken CV/preview instrumentation appear green.
      - name: Device Runtime Verification (WeChatQRCode + Native CV Subsystem on x86_64 Emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          working-directory: ./android
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The emulator action runs each nonempty script line in its own
          # sh -c process. Keep each command self-contained; never use shell
          # continuations or multi-line compound statements in this input.
          emulator-port: 5554
          script: |
            chmod +x ./gradlew
            timeout 90s sh -c 'until [ "$(timeout 5s adb -s emulator-5554 get-state 2>/dev/null)" = device ] && [ "$(timeout 5s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ] && timeout 5s adb -s emulator-5554 shell pm path android 2>/dev/null | grep -q "^package:"; do sleep 2; done' || ( echo "::error::Emulator ADB, boot, or package manager readiness timed out"; adb devices -l; exit 1 )
            adb -s emulator-5554 shell getprop ro.product.cpu.abilist
            adb -s emulator-5554 shell getprop ro.product.cpu.abi | tr -d '\r' | grep -qx x86_64 || ( echo "::error::Expected a native x86_64 Android guest"; exit 1 )
            ./gradlew :app:connectedDebugAndroidTest -PcvEmulatorX86=true -Pandroid.testInstrumentationRunnerArguments.package=com.veilframe.app.cv,com.veilframe.app.media.dialogs || ( status=$?; echo "=== Dumping native CV/preview instrumentation logcat ==="; timeout 20s adb -s emulator-5554 logcat -d -b crash || true; timeout 20s adb -s emulator-5554 logcat -d -s AndroidRuntime:E DEBUG:E libc:F | tail -n 100 || true; exit "$status" )

      - name: Upload Connected Android Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-android-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

      - name: Upload Custom OpenCV SDK Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veilframe-custom-opencv-sdk
          path: |
            android/opencv-sdk/src/main/jniLibs/
            android/opencv-sdk/src/main/java/
            android/opencv-sdk/src/main/res/
            android/opencv-sdk/src/main/.opencv-sdk-complete
            android/opencv-sdk/build/outputs/aar/
          include-hidden-files: true
          if-no-files-found: ignore
