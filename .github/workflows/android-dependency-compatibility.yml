name: Android Dependency Compatibility

on:
  pull_request:
    paths:
      - 'android/**/*.gradle.kts'
      - 'android/gradle.properties'
      - 'android/gradle/wrapper/gradle-wrapper.properties'
      - '.github/workflows/android-dependency-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-compatibility:
    name: Resolve Android dependency graphs
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up stable Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Restore validated Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Validate Gradle configuration and direct/transitive dependencies
        working-directory: android
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x ./gradlew
          for attempt in 1 2 3 4; do
            logfile="$(mktemp)"
            if ./gradlew :app:verifyDependencyResolution --no-daemon --max-workers=2 --stacktrace >"$logfile" 2>&1; then
              cat "$logfile"
              rm -f "$logfile"
              exit 0
            fi
            # A 429 is a rate-limit response from a trusted repository,
            # not a version or compatibility defect. All other errors fail.
            if ! grep -Eiq 'HTTP.*429|status code 429|Too Many Requests' "$logfile"; then
              cat "$logfile"
              rm -f "$logfile"
              exit 1
            fi
            echo "::warning::Maven rate limited dependency resolution (HTTP 429), attempt $attempt/4"
            if [ "$attempt" -eq 4 ]; then
              cat "$logfile"
              rm -f "$logfile"
              exit 1
            fi
            rm -f "$logfile"
            sleep $((attempt * 30))
          done
