name: Android Dependency Compatibility

on:
  pull_request:
    paths:
      - 'android/**/*.gradle.kts'
      - 'android/gradle.properties'
      - 'android/gradle/wrapper/gradle-wrapper.properties'
      - '.github/workflows/android-dependency-compatibility.yml'
      - 'android/app/src/main/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-compatibility:
    name: Resolve Android dependency graphs
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up stable Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Validate Gradle configuration and direct/transitive dependencies
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:verifyDependencyResolution --no-daemon --stacktrace

      # Diagnose the protobuf/Tink warning emitted by release R8/D8. Do not
      # suppress com.google.protobuf.use_unsafe_pre22_gencode: the fix belongs
      # in the dependency which ships the generated classes.
      - name: Audit Tink and protobuf transitive dependency paths
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p ../dependency-audit
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > ../dependency-audit/releaseRuntimeClasspath.txt
          ./gradlew :app:dependencies --configuration releaseCompileClasspath --no-daemon > ../dependency-audit/releaseCompileClasspath.txt
          for module in tink tink-android protobuf-javalite protobuf-java protobuf-kotlin-lite protobuf-kotlin; do
            ./gradlew :app:dependencyInsight --dependency "$module" --configuration releaseRuntimeClasspath --no-daemon \
              > "../dependency-audit/${module}-insight.txt"
          done
          grep -Ein 'tink|protobuf|mlkit|play-services|firebase' ../dependency-audit/releaseRuntimeClasspath.txt \
            > ../dependency-audit/security-relevant-paths.txt || true
          echo "Dependency path audit completed. Inspect artifact for the exact owner of generated Tink classes."
          cat ../dependency-audit/security-relevant-paths.txt

      - name: Upload dependency security audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-dependency-security-audit
          path: dependency-audit/
          if-no-files-found: warn
