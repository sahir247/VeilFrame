org.gradle.daemon=false
org.gradle.jvmargs=-Xmx2560m -XX:+UseG1GC -Dfile.encoding=UTF-8
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
android.useAndroidX=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Use external Kotlin Gradle Plugin 2.4.21 instead of AGP's bundled Kotlin.
android.builtInKotlin=false
# KGP 2.4.21 still uses the legacy Android extension API; disable AGP 9's new DSL
# until the external Kotlin plugin supports it. Remove this when migrating to built-in Kotlin.
android.newDsl=false
