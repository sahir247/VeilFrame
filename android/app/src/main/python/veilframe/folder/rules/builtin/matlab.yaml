# MATLAB Ecosystem Rules
rules:
  - id: "matlab.compiled"
    ecosystems: ["matlab"]
    patterns:
      - "*.mex*"
    classification: "COMPILED"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Compiled MATLAB MEX executable binary"
    priority: "ECOSYSTEM"

  - id: "matlab.data"
    ecosystems: ["matlab"]
    patterns:
      - "*.mat"
    classification: "DATASET"
    action: "DESCRIBE"
    confidence: 0.9
    reason: "MATLAB binary data container"
    priority: "ECOSYSTEM"

  - id: "matlab.source"
    ecosystems: ["matlab"]
    patterns:
      - "*.m"
      - "*.mlx"
    classification: "SOURCE"
    action: "INCLUDE"
    confidence: 0.95
    reason: "MATLAB script or live script"
    priority: "ECOSYSTEM"
