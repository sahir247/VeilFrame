# Clojure Ecosystem Rules
rules:
  - id: "clojure.artifacts"
    ecosystems: ["clojure", "leiningen"]
    patterns:
      - "target/"
      - "classes/"
      - ".checkouts/"
      - ".cpcache/"
      - ".shadow-cljs/"
    classification: "BUILD_OUTPUT"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Clojure compiled classes, classpath cache, or shadow-cljs state"
    priority: "ECOSYSTEM"

  - id: "clojure.manifests"
    ecosystems: ["clojure", "leiningen"]
    patterns:
      - "project.clj"
      - "deps.edn"
      - "build.clj"
      - "shadow-cljs.edn"
    classification: "MANIFEST"
    action: "INCLUDE"
    confidence: 1.0
    reason: "Clojure Leiningen or CLI deps manifest"
    priority: "ECOSYSTEM"

  - id: "clojure.source"
    ecosystems: ["clojure"]
    patterns:
      - "*.clj"
      - "*.cljs"
      - "*.cljc"
      - "*.edn"
    classification: "SOURCE"
    action: "INCLUDE"
    confidence: 0.95
    reason: "Clojure source code or EDN data structure"
    priority: "ECOSYSTEM"
