# Elixir Ecosystem Rules
rules:
  - id: "elixir.build_and_deps"
    ecosystems: ["elixir", "mix"]
    patterns:
      - "_build/"
      - "deps/"
      - ".elixir_ls/"
      - "*.beam"
    classification: "BUILD_OUTPUT"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Mix compiled build artifacts, dependencies, and ElixirLS state"
    priority: "ECOSYSTEM"

  - id: "elixir.manifests"
    ecosystems: ["elixir", "mix"]
    patterns:
      - "mix.exs"
      - "mix.lock"
    classification: "MANIFEST"
    action: "INCLUDE"
    confidence: 1.0
    reason: "Elixir Mix project specification and lockfile"
    priority: "ECOSYSTEM"

  - id: "elixir.source"
    ecosystems: ["elixir"]
    patterns:
      - "*.ex"
      - "*.exs"
    classification: "SOURCE"
    action: "INCLUDE"
    confidence: 0.95
    reason: "Elixir source code or script"
    priority: "ECOSYSTEM"
