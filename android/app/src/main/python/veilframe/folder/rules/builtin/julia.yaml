# Julia Ecosystem Rules
rules:
  - id: "julia.caches"
    ecosystems: ["julia"]
    patterns:
      - ".julia/"
    classification: "CACHE"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Julia package environment or precompilation cache"
    priority: "ECOSYSTEM"

  - id: "julia.manifests"
    ecosystems: ["julia"]
    patterns:
      - "Project.toml"
      - "Manifest.toml"
    classification: "MANIFEST"
    action: "INCLUDE"
    confidence: 1.0
    reason: "Julia project environment specification"
    priority: "ECOSYSTEM"

  - id: "julia.source"
    ecosystems: ["julia"]
    patterns:
      - "*.jl"
    classification: "SOURCE"
    action: "INCLUDE"
    confidence: 0.95
    reason: "Julia source code"
    priority: "ECOSYSTEM"
