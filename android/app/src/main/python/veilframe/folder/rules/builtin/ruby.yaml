# Ruby Ecosystem Rules
rules:
  - id: "ruby.bundle"
    ecosystems: ["ruby", "bundler"]
    patterns:
      - ".bundle/"
      - "vendor/bundle/"
    classification: "DEPENDENCY"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Ruby Bundler gems cache and local vendor path"
    priority: "ECOSYSTEM"

  - id: "ruby.manifests"
    ecosystems: ["ruby", "bundler"]
    patterns:
      - "Gemfile"
      - "Gemfile.lock"
      - "*.gemspec"
    classification: "MANIFEST"
    action: "INCLUDE"
    confidence: 1.0
    reason: "Ruby gem dependencies specification"
    priority: "ECOSYSTEM"

  - id: "ruby.source"
    ecosystems: ["ruby"]
    patterns:
      - "*.rb"
      - "*.rake"
      - "Rakefile"
    classification: "SOURCE"
    action: "INCLUDE"
    confidence: 0.95
    reason: "Ruby source code or Rake task"
    priority: "ECOSYSTEM"
