# AI and Machine Learning Ecosystem Rules
rules:
  - id: "ai.model_weights"
    ecosystems: ["ai_ml", "python"]
    patterns:
      - "*.safetensors"
      - "*.pt"
      - "*.pth"
      - "*.ckpt"
      - "*.onnx"
      - "*.gguf"
      - "*.ggml"
      - "*.h5"
      - "*.hdf5"
      - "*.pb"
      - "*.tflite"
    classification: "MODEL"
    action: "DESCRIBE"
    confidence: 0.95
    reason: "Pre-trained machine learning model weights (described with metadata)"
    priority: "ECOSYSTEM"

  - id: "ai.experiment_runs"
    ecosystems: ["ai_ml", "python"]
    patterns:
      - "runs/"
      - "wandb/"
      - "mlruns/"
      - ".tensorboard/"
      - "lightning_logs/"
      - "checkpoints/"
    classification: "RUNTIME_DATA"
    action: "EXCLUDE"
    confidence: 0.95
    reason: "Machine learning experiment logs, checkpoints, and tracking telemetry"
    priority: "ECOSYSTEM"

  - id: "ai.datasets"
    ecosystems: ["ai_ml", "data"]
    patterns:
      - "datasets/"
      - "data/"
    classification: "DATASET"
    action: "DESCRIBE"
    confidence: 0.85
    reason: "Training or evaluation dataset directory (described with schema)"
    priority: "ECOSYSTEM"
