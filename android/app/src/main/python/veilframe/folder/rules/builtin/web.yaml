# Web and Frontend Framework Rules
rules:
  - id: "web.framework_builds"
    ecosystems: ["javascript", "typescript", "web", "react", "next", "nuxt", "vue", "angular", "svelte", "astro"]
    patterns:
      - ".next/"
      - ".nuxt/"
      - ".output/"
      - ".nitro/"
      - ".angular/"
      - ".vite/"
      - ".turbo/"
      - ".parcel-cache/"
      - ".svelte-kit/"
      - ".astro/"
      - ".cache/"
    classification: "BUILD_OUTPUT"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Frontend framework compilation output or intermediate bundle cache"
    priority: "FRAMEWORK"

  - id: "web.dist_output"
    ecosystems: ["javascript", "typescript", "web"]
    patterns:
      - "dist/"
      - "out/"
      - "build/"
    classification: "BUILD_OUTPUT"
    action: "EXCLUDE"
    confidence: 0.9
    reason: "Compiled web distribution bundle"
    priority: "ECOSYSTEM"

  - id: "web.source_assets"
    ecosystems: ["web", "javascript", "typescript"]
    patterns:
      - "*.html"
      - "*.css"
      - "*.scss"
      - "*.sass"
      - "*.less"
      - "*.vue"
      - "*.svelte"
      - "src/"
      - "components/"
      - "pages/"
      - "app/"
      - "styles/"
      - "public/"
    classification: "SOURCE"
    action: "INCLUDE"
    confidence: 0.95
    reason: "Web markup, style, template, or public asset source"
    priority: "ECOSYSTEM"
