# Kotlin Ecosystem Rules
rules:
  - id: "kotlin.caches"
    ecosystems: ["kotlin"]
    patterns:
      - ".kotlin/"
      - ".kotlin-daemon/"
    classification: "CACHE"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Kotlin compiler daemon or local cache"
    priority: "ECOSYSTEM"

  - id: "kotlin.source"
    ecosystems: ["kotlin"]
    patterns:
      - "*.kt"
      - "*.kts"
    classification: "SOURCE"
    action: "INCLUDE"
    confidence: 0.95
    reason: "Kotlin source code or Gradle script"
    priority: "ECOSYSTEM"
