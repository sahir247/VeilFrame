# Infrastructure, Cloud, and Container Rules
rules:
  - id: "infra.terraform_cache"
    ecosystems: ["terraform", "infrastructure"]
    patterns:
      - ".terraform/"
    classification: "CACHE"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Terraform provider plugins and internal cache"
    priority: "ECOSYSTEM"

  - id: "infra.terraform_manifests"
    ecosystems: ["terraform", "infrastructure"]
    patterns:
      - "*.tf"
      - "*.tfvars"
      - ".terraform.lock.hcl"
    classification: "CONFIG"
    action: "INCLUDE"
    confidence: 1.0
    reason: "Terraform HCL infrastructure code and lockfile"
    priority: "ECOSYSTEM"

  - id: "infra.docker"
    ecosystems: ["docker", "container", "infrastructure"]
    patterns:
      - "Dockerfile"
      - "Dockerfile.*"
      - "docker-compose.yml"
      - "docker-compose.*.yml"
      - "compose.yml"
      - "compose.*.yml"
      - ".dockerignore"
    classification: "CONFIG"
    action: "INCLUDE"
    confidence: 1.0
    reason: "Docker container and service composition manifest"
    priority: "ECOSYSTEM"

  - id: "infra.kubernetes"
    ecosystems: ["kubernetes", "k8s", "infrastructure"]
    patterns:
      - "charts/"
      - "helm/"
      - "k8s/"
      - "manifests/"
    classification: "CONFIG"
    action: "INCLUDE"
    confidence: 0.9
    reason: "Kubernetes resources, Helm charts, or manifests"
    priority: "ECOSYSTEM"
