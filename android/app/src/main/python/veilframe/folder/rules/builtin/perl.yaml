# Perl Ecosystem Rules
rules:
  - id: "perl.build_artifacts"
    ecosystems: ["perl"]
    patterns:
      - "blib/"
      - "_build/"
      - "MYMETA.json"
      - "MYMETA.yml"
    classification: "BUILD_OUTPUT"
    action: "EXCLUDE"
    confidence: 1.0
    reason: "Perl module build artifacts"
    priority: "ECOSYSTEM"

  - id: "perl.manifests"
    ecosystems: ["perl"]
    patterns:
      - "Makefile.PL"
      - "Build.PL"
      - "cpanfile"
    classification: "MANIFEST"
    action: "INCLUDE"
    confidence: 1.0
    reason: "Perl CPAN package configuration"
    priority: "ECOSYSTEM"

  - id: "perl.source"
    ecosystems: ["perl"]
    patterns:
      - "*.pl"
      - "*.pm"
      - "*.t"
    classification: "SOURCE"
    action: "INCLUDE"
    confidence: 0.95
    reason: "Perl script, module, or test"
    priority: "ECOSYSTEM"
